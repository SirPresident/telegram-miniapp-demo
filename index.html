        /* Liquid Glass theme control */
        .switch {
            position: relative;
            width: 58px;
            height: 34px;
            margin: 0 !important;
            display: block;
            flex: 0 0 auto;
        }

        .switch input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .slider-switch {
            position: absolute;
            inset: 0;
            cursor: pointer;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.42);
            background: rgba(255,255,255,.34);
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.65),
                inset 0 -1px 2px rgba(0,0,0,.08),
                0 4px 14px rgba(0,0,0,.08);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            transition: background .35s ease, border-color .35s ease, box-shadow .35s ease;
        }

        /* The moving glass thumb */
        .slider-switch:before {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: rgba(255,255,255,.92);
            border: 1px solid rgba(255,255,255,.75);
            box-shadow:
                0 2px 7px rgba(0,0,0,.16),
                inset 0 1px 1px rgba(255,255,255,.9);
            transition: transform .38s cubic-bezier(.22,1,.36,1), background .35s ease;
            z-index: 2;
        }

        /* Moon icon */
        .slider-switch:after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            left: 9px;
            top: 9px;
            background: url('assets/icons/Moon.svg') center / contain no-repeat;
            opacity: .7;
            z-index: 3;
            pointer-events: none;
            transition: left .38s cubic-bezier(.22,1,.36,1), opacity .25s ease, filter .25s ease;
        }

        /* Light = thumb on the right, moon remains subtly visible */
        input:not(:checked) + .slider-switch:before {
            transform: translateX(24px);
        }

        input:not(:checked) + .slider-switch:after {
            left: 33px;
            background-image: url('assets/icons/Sun.svg');
            opacity: .68;
            filter: none;
        }

        /* Dark = thumb on the left, moon icon */
        input:checked + .slider-switch {
            background: rgba(20,20,24,.52);
            border-color: rgba(255,255,255,.18);
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.16),
                inset 0 -1px 2px rgba(0,0,0,.18),
                0 5px 18px rgba(0,0,0,.22);
        }

        input:checked + .slider-switch:before {
            transform: translateX(0);
            background: rgba(255,255,255,.94);
        }

        input:checked + .slider-switch:after {
            left: 9px;
            background-image: url('assets/icons/Moon.svg');
            opacity: .72;
            filter: none;
        }

        body.dark .slider-switch {

        /* Capsule Tab Styles */
        .capsule-tabs {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            margin-bottom: 0;
            width: auto;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(var(--bg-color-rgb), 0.6);  /* Semi-transparent background */
            border-radius: 7px;
            box-shadow: none;
            border: 1px solid var(--border-color);
            padding: 3px 16px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .capsule-tab-group {
            display: flex;
            gap: 1.2rem;
            background: transparent; 
            border-radius: 10px;
            padding: 8px 12px;
            /* Use only shadow-outer style */
            /* box-shadow:
                4px 4px 30px var(--shadow-dark),
                -10px -10px 30px var(--shadow-light); */
        }
        .capsule-tab-btn {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--highlight-below);
            /* Use only shadow-outer style */
            box-shadow: none;
            border: 1px solid var(--border-color);
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                width 0.35s cubic-bezier(.4,2,.6,1),
                border-radius 0.35s cubic-bezier(.4,2,.6,1),
                background 0.25s,
                box-shadow 0.25s;
            overflow: hidden;
            padding: 0;
            margin: 0;
            min-width: 48px;
            z-index: 1;
        }
        .capsule-icon img {
            width: 1.2em;
            height: 1.2em;
            display: inline-block;
            vertical-align: middle;
            }
        .capsule-tab-btn .capsule-icon,
        .capsule-tab-btn .capsule-text {
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 1.5rem;
            transition:
                opacity 0.25s cubic-bezier(.4,2,.6,1),
                transform 0.35s cubic-bezier(.4,2,.6,1);
            pointer-events: none;
            user-select: none;
        }
        .capsule-tab-btn .capsule-text {
            opacity: 0;
            transform: translateY(10px);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--text-color);
        }
        .capsule-tab-btn.active {
            width: 130px; /* Enough for "Level up" or "Home" */
            border-radius: 24px;
            background: var(--highlight-above);
        }
        .capsule-tab-btn.active .capsule-icon {
            opacity: 0;
            transform: translateY(-10px) scale(0.7);
        }
        .capsule-tab-btn.active .capsule-text {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            .capsule-tabs {
                width: 90%;

                justify-content: center; /* Add this line */
            }
            .capsule-tab-group {

        /* ————————————— Neumorphic noUiSlider Styling ————————————— */
        
        #slider {
            /* Flex item properties (how it behaves in its parent .inner) */
            /* --- THIS IS THE KEY FOR THE OVERALL WIDTH OF THE SLIDER ELEMENT --- */
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: 10px; /* SET YOUR DESIRED FINAL WIDTH HERE */
            /* OR shorthand: flex: 0 0 8px; */

            /* Margins - decide which ones you want */
            margin-left: 5px;   /* From your second attempt, or choose what looks best */
            margin-right: 15px; /* From your second attempt */

            /* Appearance and flex container properties (how it lays out its own children) */
            background: var(--bg-color);
            box-shadow: none;
            border: 1px solid var(--border-color);
            border-radius: 4px; /* If width is 8px, radius 4px makes ends perfectly round */
            width: 8px;         /* Explicitly set width, consistent with flex-basis */
            min-width: 8px;     /* Consistent with flex-basis */

            display: flex;
            align-items: stretch;
            justify-content: center;
        }


        /* the filled-in “connect” bar between handles */
        #slider .noUi-connect {
            background: linear-gradient(to top, var(--chart-grad-end), var(--chart-grad-start));
            box-shadow:
                inset 0px 0px 12px var(--shadow-dark),
                inset 0px 0px 12px var(--shadow-light);
        }

        /* the draggable handles */
        #slider .noUi-handle {
            width: 18px;
            height: 12px;
            border-radius: 0% 50% 50% 0%;
            background: var(--text-color);
            /* Use only shadow-outer style */
            box-shadow: none;
            border: 1px solid var(--border-color);
            /* left: auto;
            top: auto; */
            /* right: -10px !important;  */
            bottom: -8px;
            /* transform: translateY(0); */
            transition: box-shadow 0.3s;
            cursor: grab;
        }

        /* remove the default handle “bars” */
        #slider .noUi-handle:before,
        #slider .noUi-handle:after {
            display: none;
        }

        /* handle pressed state */
        #slider .noUi-handle:active {
            box-shadow: none;
            border: 1px solid var(--border-color);
        }

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 60px; /* Leaves space for hamburger */
    text-align: center;
    position: relative;
}

/* Make room for hamburger in search tab */
.search-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-left: 60px; /* Leaves space for hamburger */
}

.search-input {
    max-width: 400px;
    width: 100%;
}

@media (max-width: 600px) {
    #header,
    .search-container {
        padding-left: 48px; /* Slightly less on mobile */
    }
    .search-input {
        max-width: 100vw;
    }
}

.hamburger-svg {
    width: 40px;
    height: 40px;
    display: block;
    margin: auto;
    filter: invert(0); /* For dark mode, you can use filter: invert(1); if needed */
    transition: filter 0.2s;
}
body.dark .hamburger-svg {
    filter: invert(1);
}
.icon-svg {
    width: 1.2em;
    height: 1.2em;
    display: inline-block;
    vertical-align: middle;
    filter: invert(0);
    transition: filter 0.2s;
}
body.dark .icon-svg {
    filter: invert(1);
}

<style id="ui-final-polish">
/* Final UI polish: preserve existing behavior while tightening the visual system. */
:root {
  --ui-accent: #6d6cff;
  --ui-accent-2: #8e82ff;
  --ui-blue: #59b7ff;
  --ui-glass: rgba(255,255,255,.55);
  --ui-glass-strong: rgba(255,255,255,.72);
  --ui-line: rgba(255,255,255,.72);
  --ui-shadow: 0 18px 50px rgba(36,40,66,.11);
  --ui-shadow-soft: 0 8px 24px rgba(36,40,66,.08);
  --ui-radius: 20px;
}
body.dark {
  --ui-glass: rgba(27,29,36,.58);
  --ui-glass-strong: rgba(34,36,45,.76);
  --ui-line: rgba(255,255,255,.12);
  --ui-shadow: 0 24px 60px rgba(0,0,0,.34);
  --ui-shadow-soft: 0 10px 28px rgba(0,0,0,.24);
}

body {
  position: relative;
  overflow-x: hidden;
  background:
    radial-gradient(800px 420px at 0% -10%, rgba(124,110,255,.18), transparent 62%),
    radial-gradient(700px 380px at 100% 4%, rgba(73,182,255,.14), transparent 58%),
    linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end)) !important;
}
body:before {
  content:"";
  position: fixed;
  inset: 0;
  pointer-events:none;
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 24%);
  z-index: -1;
}

/* Header */
#header {
  margin: 8px 0 20px !important;
}
#header h1,
#levelup h2 {
  font-weight: 760 !important;
  letter-spacing: -.035em !important;
}
#todayDate {
  color: var(--lg-muted) !important;
}

/* Main chart card */
.chart-wrap {
  border-radius: 24px !important;
  padding: 14px !important;
  box-shadow: var(--ui-shadow), inset 0 1px 0 rgba(255,255,255,.62) !important;
}
.chart-wrap:after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius: inherit;
  background: linear-gradient(120deg, rgba(255,255,255,.12), transparent 32%, transparent 72%, rgba(255,255,255,.05));
}

/* Timeline controls */
.segment-label {
  min-height: 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  letter-spacing:.01em;
}
.nav-buttons {
  max-width: 560px;
  margin-inline:auto !important;
}
.nav-buttons button {
  min-height: 46px;
  border-radius: 14px !important;
  background: var(--ui-glass) !important;
  border: 1px solid var(--ui-line) !important;
  box-shadow: var(--ui-shadow-soft), inset 0 1px 0 rgba(255,255,255,.5) !important;
  font-weight: 700;
}
.nav-buttons button:hover:not(:disabled) {
  background: var(--ui-glass-strong) !important;
  box-shadow: 0 12px 28px rgba(36,40,66,.12), inset 0 1px 0 rgba(255,255,255,.65) !important;
}

/* Dataset summary */
.range-row { max-width: 920px; margin-inline:auto !important; }
.range-row label { font-weight:650 !important; }
#panelRangeSelect {
  min-height: 42px;
  padding-right: 34px !important;
  font-weight: 650;
}
.panels {
  align-items: stretch;
}
.panel {
  min-height: 164px !important;
  box-shadow: var(--ui-shadow-soft), inset 0 1px 0 rgba(255,255,255,.50) !important;
}
.panel h3 {
  display:flex;
  align-items:center;
}
.panel h3:before {
  width: 8px !important;
  height: 8px !important;
  flex:0 0 auto;
}

/* Logs */
.search-container {
  position:relative;
}
.search-container:before {
  content:"";
  position:absolute;
  left:18px;
  top:50%;
  width:16px;
  height:16px;
  transform:translateY(-50%);
  border:2px solid var(--lg-muted);
  border-radius:50%;

}
.search-container:after {
  content:"";

  transform-origin:left center;
  background:var(--lg-muted);
  opacity:.6;
  pointer-events:none;

.search-input {
  padding-left:48px !important;

/* Skills */
.skill-item {

.skill-item:hover {

.skill-focus-section {

}

/* Drawer */
#hamburgerBtn {
  transition: transform .2s ease, box-shadow .2s ease !important;
}
#hamburgerBtn:hover { transform: translateY(-1px); }
#hamburgerBtn:active { transform: scale(.95); }
.side-menu:after {
  content:"";
  position:absolute;
  top:12px; right:12px;
  width:54px; height:54px;
  background: radial-gradient(circle, rgba(124,110,255,.16), transparent 68%);
  pointer-events:none;
}

/* Bottom navigation */
.capsule-tabs {
  isolation:isolate;
}
.capsule-tab-btn {
  min-width:48px;
  height:46px;
}
.capsule-tab-btn .capsule-icon img { width:20px; height:20px; }
.capsule-tab-btn.active {
  color: var(--ui-accent) !important;
}
.capsule-tab-btn:focus-visible,
button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline:none !important;
  box-shadow: 0 0 0 3px rgba(109,108,255,.20) !important;
}

/* Vertical date slider */
#slider {
  box-shadow: inset 0 1px 4px rgba(30,35,55,.08), 0 5px 16px rgba(30,35,55,.06) !important;
}
#slider .noUi-handle {
  border:2px solid rgba(255,255,255,.88) !important;
  box-shadow: 0 4px 12px rgba(30,35,55,.16), inset 0 1px 0 rgba(255,255,255,.48) !important;
}

/* Better responsive proportions */
@media (min-width: 1100px) {
  .container, .tab-content { width:min(100%, 980px) !important; }
  .chart-wrap { height:390px !important; }
}
@media (max-width: 800px) {
  .panels { grid-template-columns:1fr !important; }
  .panel { min-height:unset !important; }
}
@media (max-width: 600px) {
  body { padding-left:10px !important; padding-right:10px !important; }
  #header { margin-top:2px !important; margin-bottom:14px !important; }
  #header h1 { font-size:1.3rem !important; }
  .chart-wrap { height:295px !important; padding:10px !important; border-radius:20px !important; }
  .range-row { margin-top:12px !important; }
  .range-row label { font-size:.76rem !important; }
  .nav-buttons { gap:8px !important; }
  .nav-buttons button { min-height:42px; }
  .panel { border-radius:18px !important; }
  .log-date-header,.log-entry,.search-input,.skill-focus-section { border-radius:18px !important; }
  .capsule-tabs { width:calc(100% - 20px) !important; }
}
</style>

    <script>
    // Capsule Tab Logic
    document.addEventListener('DOMContentLoaded', () => {
        const tabBtns = [
            { btn: document.getElementById('tab-home'), content: document.getElementById('home') },
            { btn: document.getElementById('tab-logs'), content: document.getElementById('logs') },
            { btn: document.getElementById('tab-levelup'), content: document.getElementById('levelup') }
        ];

        function activateTab(idx) {
            tabBtns.forEach((tab, i) => {
                if (i === idx) {
                    tab.btn.classList.add('active');
                    tab.content.classList.add('active');
                    tab.content.style.display = '';
                } else {
                    tab.btn.classList.remove('active');
                    tab.content.classList.remove('active');
                    tab.content.style.display = 'none';
                }
            });
        }

        tabBtns.forEach((tab, tabIndex) => {
            tab.btn.addEventListener('click', () => {
                activateTab(tabIndex);
                if (tab.content.id === 'logs') {
                    displayAllLogs();
                } else if (tab.content.id === 'levelup') {
                    calculateSkillLevels();
                    displaySkills();
                }
            });
        });

        // Search functionality
        const searchInput = document.getElementById('logSearch');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filterLogs(searchTerm);
        });

        activateTab(0);
    });
    </script>

    <script>

    <script>
        const tg = window.Telegram.WebApp;
        const BACKEND_URL_BASE = 'https://mrfinarfin-bot-subdomain.loca.lt'; // Replace!
        let telegramUser = null;
        let allUserLogs = [];
        let moodChartInstance = null;
        let weekSegments = [];
        let idx = 0;
        let slider = null;

        const SKILLS_CONFIG = {
            strength:     { icon: '💪', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            endurance:    { icon: '🏃', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            intelligence: { icon: '🧠', baseXP: 120, exponent: 1.6, currentXP: 0, currentLevel: 0 },
            charisma:     { icon: '🗣️', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            perception:   { icon: '👁️', baseXP: 110, exponent: 1.55, currentXP: 0, currentLevel: 0 },
            wellbeing:    { icon: '🧘', baseXP: 80,  exponent: 1.4, currentXP: 0, currentLevel: 0 }
        };

        function getXPForLevel(level, baseXP, exponent) {
            if (level <= 0) return 0;
            let totalXPNeeded = 0;
            for (let i = 1; i <= level; i++) {
                totalXPNeeded += Math.floor(baseXP * Math.pow(i, exponent - 1));
            }
            return totalXPNeeded;
        }

        function calculateSkillLevels() {
            for (const skillName in SKILLS_CONFIG) {
                const config = SKILLS_CONFIG[skillName];
                config.currentXP = 0;
                config.currentLevel = 0;
            }

            allUserLogs.forEach(log => {
                for (const skillName in SKILLS_CONFIG) {
                    const xpField = `${skillName}_xp_gained`;
                    if (log[xpField] && typeof log[xpField] === 'number') {
                        SKILLS_CONFIG[skillName].currentXP += log[xpField];
                    }
                }
            });

            for (const skillName in SKILLS_CONFIG) {
                const config = SKILLS_CONFIG[skillName];
                let level = 0;
                let xpRemaining = config.currentXP;
                let xpForNextLevel = 0;

                while (true) {
                    xpForNextLevel = getXPForLevel(level + 1, config.baseXP, config.exponent) - 
                                    getXPForLevel(level, config.baseXP, config.exponent);
                    if (xpRemaining >= xpForNextLevel && xpForNextLevel > 0) {
                        xpRemaining -= xpForNextLevel;
                        level++;
                    } else {
                        break;
                    }
                }
                config.currentLevel = level;
                config.xpTowardsNextLevel = xpRemaining;
                config.xpToCompleteCurrentLevel = xpForNextLevel;
            }
        }

        function displaySkills() {
        const skillsContainer = document.getElementById('skillsContainer');
        if (!skillsContainer) return;
        skillsContainer.innerHTML = '';

        let skillsToShowCount = 0;

        for (const skillName in SKILLS_CONFIG) {
            const config = SKILLS_CONFIG[skillName];

            if (config.currentXP > 0) {
                skillsToShowCount++;

                const level = config.currentLevel;
                const xpNeededForThisLevel = getXPForLevel(level + 1, config.baseXP, config.exponent) - 
                                        getXPForLevel(level, config.baseXP, config.exponent);
                const currentXPInThisLevel = config.xpTowardsNextLevel;
                
                let progressPercent = (xpNeededForThisLevel > 0) ? 
                    (currentXPInThisLevel / xpNeededForThisLevel) * 100 : 0;
                progressPercent = Math.min(progressPercent, 100);

                const skillDiv = document.createElement('div');
                skillDiv.className = 'skill-item';
                skillDiv.innerHTML = `
                    <div class="skill-header">
                        <span class="skill-icon">${config.icon}</span>
                        <span class="skill-name">${skillName.charAt(0).toUpperCase() + skillName.slice(1)}</span>
                        <span class="skill-level">Lvl ${level}</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progressPercent}%;"></div>
                    </div>
                    <div class="skill-xp-info">
                        ${currentXPInThisLevel}/${xpNeededForThisLevel} XP
                    </div>
                `;
                skillsContainer.appendChild(skillDiv);
            }
        }

        if (skillsToShowCount === 0) {
            skillsContainer.innerHTML = '<p style="text-align:center; color:var(--text-color);">Start logging activities to see your skills grow here!</p>';
        }
    }

        tg.ready(); tg.expand();

        document.addEventListener('DOMContentLoaded', () => {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                telegramUser = tg.initDataUnsafe.user;
                // document.getElementById('userInfo').innerText = `Logs for: ${telegramUser.first_name || ''} (@${telegramUser.username || 'N/A'})`;
                if (telegramUser.id) {
                    fetchAllLogsAndSetupChart();
                } else {
                    document.getElementById('loadingMessage').innerText = "Cannot load: User ID unavailable.";
                }
            } else {
                document.getElementById('userInfo').innerText = "Could not load Telegram user data.";
                document.getElementById('loadingMessage').innerText = "Cannot load logs: User data unavailable.";
            }

            document.getElementById('prevWeekBtn').addEventListener('click', () => { if(idx>0) idx--; updateView(); });
            document.getElementById('nextWeekBtn').addEventListener('click', () => { if(idx<weekSegments.length-1) idx++; updateView(); });

            // Panel range select event
            const panelRangeSelect = document.getElementById('panelRangeSelect');
            panelRangeSelect.addEventListener('change', (e) => {
                panelRange = e.target.value;
                updatePanels(idx);
            });
        });

        function setupChartAndSlider() {
            // Prepare data for the current week
            const ctx = document.getElementById('moodScoreChart').getContext('2d');
            // Plugins
            const thresholdPlugin = {
                id:'thresholdPlugin',
                beforeDraw(c){
                    const {ctx,chartArea:{left,right},scales:{y}} = c;
                    const {min,max} = c.config.options.thresholds;
                    ctx.save(); ctx.setLineDash([6,4]);
                    ctx.strokeStyle='crimson';
                    ctx.beginPath();
                    ctx.moveTo(left,y.getPixelForValue(min));
                    ctx.lineTo(right,y.getPixelForValue(min));
                    ctx.stroke();
                    ctx.strokeStyle='seagreen';
                    ctx.beginPath();
                    ctx.moveTo(left,y.getPixelForValue(max));
                    ctx.lineTo(right,y.getPixelForValue(max));
                    ctx.stroke();
                    ctx.restore();
                }
            };
            const syncHeight = {
                id:'syncHeight',
                afterLayout(c){
                    const slider = document.getElementById('slider');
                    const y = c.scales.y;
                    const top = y.getPixelForValue(c.options.scales.y.max);
                    const bot = y.getPixelForValue(c.options.scales.y.min);
                    const OFF = 0;
                    slider.style.marginTop = (top-OFF+15)+'px';
                    slider.style.height    = (bot-top+OFF*2)+'px';
                }
            };
            // Chart instance
            moodChartInstance = new Chart(ctx, {
                type:'line',
                data:{ datasets:[{ label:'Mood', data:[], fill:true, backgroundColor:makeGradient(ctx), borderColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim(), pointRadius:5, tension:0.3 }]},
                options:{
                    responsive:true,
                    maintainAspectRatio:false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'MMM dd yyyy HH:mm', // More specific tooltip
                                displayFormats: {
                                    day: 'dd'
                                },
                                // timezone: DateTime.local().zoneName // Optional: force local timezone
                            },
                            grid: { display: false },
                            ticks: { 
                                color: document.body.classList.contains('dark') ? '#ffffff' : '#000000'
                            }
                        },
                        y: {
                            min: 1,
                            max: 5,
                            grid: {
                                drawBorder: false,
                                color: getComputedStyle(document.documentElement).getPropertyValue('--shadow-dark').trim()
                            },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim(),
                                stepSize: 1,
                                callback: function(value) {
                                    // Map 1-5 to emojis
                                    const moodEmojis = {
                                        1: "🥵",
                                        2: "🥺",
                                        3: "🙂",
                                        4: "😃",
                                        5: "🤗"
                                    };
                                    return moodEmojis[value] || value;
                                }
                            }
                        }
                    },
                    plugins:{
                        legend:{display:false},
                        zoom:{ pan:{enabled:true,mode:'x'}, zoom:{wheel:{enabled:false},pinch:{enabled:false}} }
                    },
                    thresholds:{ min:2, max:4 }
                },
                plugins:[ syncHeight, thresholdPlugin ]
            });
            // Slider
            slider = document.getElementById('slider');
            if (slider.noUiSlider) slider.noUiSlider.destroy();
            noUiSlider.create(slider,{
                start:[1,5], connect:true,
                orientation:'vertical', direction:'rtl',
                range:{min:1,max:5}, step:0.1,
                tooltips:[false,false], // shows the value of handle
                format:{ to:v=>v.toFixed(1), from:v=>+v }
            });
            slider.noUiSlider.on('update', ([min, max]) => {
                min = +min;
                max = +max;
                moodChartInstance.options.thresholds.min = min;
                moodChartInstance.options.thresholds.max = max;
                
                // recolor points
                const base = getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim();
                const weekData = getWeekMoodData(idx);
                moodChartInstance.data.datasets[0].pointBackgroundColor =
                    weekData.map(pt => (pt.y >= min && pt.y <= max) ? 'seagreen' : base);
                
                // Update panels with filtered data
                updatePanels(idx);
                
                moodChartInstance.update('none');
            });
        }

        function makeGradient(ctx){
            const h = 300, g = ctx.createLinearGradient(0,0,0,h);
            const root = getComputedStyle(document.documentElement);
            const s = root.getPropertyValue('--chart-grad-start').trim() || 'rgba(54,162,235,0.6)';
            const e = root.getPropertyValue('--chart-grad-end').trim()   || 'rgba(54,162,235,0.1)';
            g.addColorStop(0,s); g.addColorStop(1,e);
            return g;
        }

        async function fetchAllLogsAndSetupChart() {
            const loadingDiv = document.getElementById('loadingMessage');
            loadingDiv.innerText = 'Loading all logs for chart...';
            loadingDiv.style.display = 'block';

            if (!telegramUser || !telegramUser.id) {
                loadingDiv.innerText = 'User ID missing for fetching logs.'; return;
            }
            const fetchUrl = `${BACKEND_URL_BASE}/api/get_user_logs/?telegram_id=${telegramUser.id}`;
            try {
                const response = await fetch(fetchUrl, {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json', 'bypass-tunnel-reminder': 'true'}
                });
                if (response.ok) {
                    const data = await response.json();
                    loadingDiv.style.display = 'none';
                    if (data.logs && data.logs.length > 0) {
                        allUserLogs = data.logs.map(log => ({
                            ...log,
                            // Create a Luxon DateTime object in user's local timezone
                            luxon_logged_at: DateTime.fromISO(log.logged_at.replace(' ', 'T') + 'Z').setZone(DateTime.local().zoneName),
                            strength_xp_gained: log.strength_xp_gained || 0,
                            endurance_xp_gained: log.endurance_xp_gained || 0,
                            intelligence_xp_gained: log.intelligence_xp_gained || 0,
                            charisma_xp_gained: log.charisma_xp_gained || 0,
                            perception_xp_gained: log.perception_xp_gained || 0,
                            wellbeing_xp_gained: log.wellbeing_xp_gained || 0
                        }));
                        allUserLogs.sort((a, b) => a.luxon_logged_at - b.luxon_logged_at);
                        weekSegments = splitLogsToWeeks(allUserLogs);
                        idx = weekSegments.length-1;
                        setupChartAndSlider();
                        updateView();
                        
                        // Calculate and display skills
                        calculateSkillLevels();
                        displaySkills();
                    } else {
                        document.getElementById('logsContainer').innerHTML = '<p style="text-align:center;">No logs found yet.</p>';
                    }
                } else {
                    let errTxt = response.statusText; try {const eD = await response.json(); errTxt = eD.error || errTxt;} catch(e){}
                    loadingDiv.innerText = `Error loading logs: ${response.status} ${errTxt}`;
                }
            } catch (error) {
                loadingDiv.innerText = `Network error loading logs: ${error}`;
                console.error("Fetch logs error:", error);
            }
        }

        function splitLogsToWeeks(logs) {
            if (!logs.length) return [];
            const weeks = [];
            let currentWeekData = [];
            // Use the local start of the week for the first log
            let currentWeekStartLuxon = logs[0].luxon_logged_at.startOf('week');

            logs.forEach(log => {
                if (log.luxon_logged_at >= currentWeekStartLuxon && log.luxon_logged_at < currentWeekStartLuxon.plus({ weeks: 1 })) {
                    currentWeekData.push(log);
                } else {
                    if (currentWeekData.length > 0) {
                        weeks.push(currentWeekData);
                    }
                    currentWeekData = [log];
                    currentWeekStartLuxon = log.luxon_logged_at.startOf('week');
                }
            });
            if (currentWeekData.length > 0) {
                weeks.push(currentWeekData);
            }
            return weeks;
        }

        function getWeekMoodData(weekIdx) {
            if (!weekSegments[weekIdx]) return [];
            const weekLogs = weekSegments[weekIdx];
            if (!weekLogs.length) return [];

            // Determine the actual start of this week segment (Monday in local time)
            const weekActualStartLuxon = weekLogs[0].luxon_logged_at.startOf('week');
            
            const daysData = [];
            for (let i = 0; i < 7; i++) {
                const currentDayLuxon = weekActualStartLuxon.plus({ days: i });
                // Filter logs that fall on this specific local day
                const dayLogs = weekLogs.filter(l =>
                    l.luxon_logged_at.toISODate() === currentDayLuxon.toISODate() &&
                    l.mood_score !== null && l.mood_score !== undefined
                );

                const avg = dayLogs.length
                            ? dayLogs.reduce((s, l) => s + l.mood_score, 0) / dayLogs.length
                            : null;
                daysData.push({
                    x: currentDayLuxon.toISODate(),
                    y: avg
                });
            }
            return daysData;
        }

        function updateView() {
            const weekData = getWeekMoodData(idx);
            moodChartInstance.data.datasets[0].data = weekData;
            moodChartInstance.data.datasets[0].backgroundColor = makeGradient(moodChartInstance.ctx);

            const currentWeekSegment = weekSegments[idx];
            if (currentWeekSegment && currentWeekSegment.length > 0) {
                const weekStartDateLuxon = currentWeekSegment[0].luxon_logged_at.startOf('week');
                const weekEndDateLuxon = weekStartDateLuxon.plus({ days: 6 });

                moodChartInstance.options.scales.x.min = weekStartDateLuxon.toISODate();
                moodChartInstance.options.scales.x.max = weekEndDateLuxon.toISODate();
                
                document.getElementById('segmentLabel').textContent = 
                //     `${weekStartDateLuxon.toFormat('LLL dd')} – ${weekEndDateLuxon.toFormat('LLL dd')}`;
                    `${weekStartDateLuxon.toFormat('LLLL - yyyy')}`;
            } else {
                document.getElementById('segmentLabel').textContent = 'No data for this week';
                moodChartInstance.options.scales.x.min = undefined;
                moodChartInstance.options.scales.x.max = undefined;
            }

            document.getElementById('prevWeekBtn').disabled = (idx === 0);
            document.getElementById('nextWeekBtn').disabled = (idx === weekSegments.length - 1);
            
            updatePanels(idx);
            moodChartInstance.update();
        }

        // Add a global to track the selected range
        let panelRange = 'week';

        // Modify updatePanels to use the selected range
        function updatePanels(weekIdx) {
            // Get current slider values
            const [minMood, maxMood] = slider.noUiSlider.get().map(Number);

            // Determine which logs to use based on panelRange
            let logsToUse = [];
            if (panelRange === 'week') {
                logsToUse = weekSegments[weekIdx] || [];
            } else if (panelRange === 'month') {
                // Get the month and year of the current week
                const weekLogs = weekSegments[weekIdx] || [];
                if (weekLogs.length > 0) {
                    const month = weekLogs[0].luxon_logged_at.month;
                    const year = weekLogs[0].luxon_logged_at.year;
                    logsToUse = allUserLogs.filter(log =>
                        log.luxon_logged_at.month === month && log.luxon_logged_at.year === year
                    );
                }
            } else if (panelRange === 'all') {
                logsToUse = allUserLogs;
            }

            // Group logs by local date using Luxon
            const dailyGroups = new Map();
            logsToUse.forEach(log => {
                const dateKey = log.luxon_logged_at.toISODate();
                if (!dailyGroups.has(dateKey)) {
                    dailyGroups.set(dateKey, {
                        logs: [],
                        totalMoodScore: 0,
                        validMoodCount: 0
                    });
                }
                const group = dailyGroups.get(dateKey);
                group.logs.push(log);
                if (log.mood_score !== null && log.mood_score !== undefined) {
                    group.totalMoodScore += log.mood_score;
                    group.validMoodCount++;
                }
            });

            // Filter days based on average mood score
            const relevantLogs = [];
            dailyGroups.forEach(group => {
                if (group.validMoodCount > 0) {
                    const avgMood = group.totalMoodScore / group.validMoodCount;
                    if (avgMood >= minMood && avgMood <= maxMood) {
                        relevantLogs.push(...group.logs);
                    }
                }
            });

            // Helper function to count and sort items
            function processItems(items) {
                const countMap = new Map();
                items.forEach(item => {
                    countMap.set(item, (countMap.get(item) || 0) + 1);
                });
                return Array.from(countMap.entries())
                    .sort((a, b) => b[1] - a[1])  // Sort by count descending
                    .map(([item, count]) => ({item, count}));
            }

            // Helper function to create panel HTML
            function createPanelHtml(sortedItems, type) {
                return sortedItems.length ? 
                    sortedItems.map(({item, count}) => 
                        `<div class="panel-item" data-item="${escapeHtml(item)}" data-type="${type}">
                            ${escapeHtml(item)} <span style="color:#aaa;">(${count}×)</span>
                        </div>`
                    ).join('') : 
                    '<span style="color:#aaa;">No data in selected mood range</span>';
            }

            // Update panels with filtered data
            // Diet Panel
            const dietPanel = document.getElementById('dietPanel');
            const dietItems = [];
            relevantLogs.forEach(log => {
                if (log.diet) {
                    for (const [cat, arr] of Object.entries(log.diet)) {
                        if (arr && arr.length) {
                            arr.forEach(item => dietItems.push(`${cat}: ${item}`));
                        }
                    }
                }
            });
            const sortedDietItems = processItems(dietItems);
            dietPanel.innerHTML = createPanelHtml(sortedDietItems, 'diet');

            // Health Panel
            const healthPanel = document.getElementById('healthPanel');
            const healthItems = [];
            relevantLogs.forEach(log => {
                if (log.health && log.health.length) {
                    log.health.forEach(item => healthItems.push(item));
                }
            });
            const sortedHealthItems = processItems(healthItems);
            healthPanel.innerHTML = createPanelHtml(sortedHealthItems, 'health');

            // Activity Panel
            const activityPanel = document.getElementById('activityPanel');
            const activityItems = [];
            relevantLogs.forEach(log => {
                if (log.activity && log.activity.length) {
                    log.activity.forEach(item => activityItems.push(item));
                }
            });
            const sortedActivityItems = processItems(activityItems);
            activityPanel.innerHTML = createPanelHtml(sortedActivityItems, 'activity');

            // Add click handlers
            document.querySelectorAll('.panel-item').forEach(item => {
                item.addEventListener('click', () => {
                    const itemText = item.dataset.item;
                    const itemType = item.dataset.type;
                    showRelevantLogs(itemText, itemType, relevantLogs);
                });
            });
        }

function showRelevantLogs(itemText, itemType, logs) {
    const relevantLogs = logs.filter(log => {
        if (itemType === 'diet') {
            return log.diet && Object.entries(log.diet).some(([cat, arr]) => 
                arr && arr.length && arr.some(item => `${cat}: ${item}` === itemText)
            );
        } else {
            return log[itemType] && log[itemType].includes(itemText);
        }
    });
    
    // Display the filtered logs
    const container = document.getElementById('logsContainer');
    container.classList.add('active');
    // Add the clicked entry as a title above the logs
    container.innerHTML = `<h2 style="margin-bottom:1rem; color:var(--text-color); font-size:1.2rem;">${escapeHtml(itemText)}</h2>`;
    displayLogEntries(relevantLogs, container);
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Update displayLogEntries to accept the container as an argument
function displayLogEntries(logsToDisplay, container = document.getElementById('logsContainer')) {
    // If container already has a title, don't overwrite it
    if (!container.querySelector('h2')) container.innerHTML = '';
    if (logsToDisplay && logsToDisplay.length > 0) {
        logsToDisplay.slice().reverse().forEach(log => {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'log-entry';
            let htmlContent = `<div class="log-meta">Logged: ${log.logged_at}</div>`;
            if(log.original_note) {
                htmlContent += `<div class="log-original-note"><strong>Original:</strong> ${escapeHtml(log.original_note)}</div>`;
            }
            if (log.mood_label) {
                htmlContent += `<div class="log-section"><h3>Mood</h3><span class="tag">${escapeHtml(log.mood_label)} (${log.mood_score || 'N/A'})</span></div>`;
            }
            if (log.health && log.health.length > 0) {
                htmlContent += `<div class="log-section"><h3>Health</h3><ul>`;
                log.health.forEach(h => { htmlContent += `<li>${escapeHtml(h)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.activity && log.activity.length > 0) {
                htmlContent += `<div class="log-section"><h3>Activity</h3><ul>`;
                log.activity.forEach(a => { htmlContent += `<li>${escapeHtml(a)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.diet && log.diet.length > 0) {
                htmlContent += `<div class="log-section"><h3>Diet</h3><ul>`;
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.length) {
                        items.forEach(item => {
                            htmlContent += `<li>${escapeHtml(category)}: ${escapeHtml(item)}</li>`;
                        });
                    }
                }
                htmlContent += `</ul></div>`;
            }
            entryDiv.innerHTML = htmlContent;
            container.appendChild(entryDiv);
        });
    } else {
        container.innerHTML += '<p style="text-align:center;">No logs found for this period or user.</p>';
    }
}

        function displayAllLogs() {
    const container = document.getElementById('allLogsContainer');
    if (!allUserLogs || !allUserLogs.length) {
        
    container.innerHTML = sortedDates.map(date => {
        const logs = groupedLogs.get(date);
        const logsCount = logs.length;
        return `
            <div class="log-group" data-date="${date}">
                <div class="log-date-header">
                    <div class="header-content">
                        <span class="expand-icon">▶</span>
                        ${DateTime.fromISO(date).toFormat('LLLL d, yyyy')}
                        <span class="logs-count">${logsCount} log${logsCount !== 1 ? 's' : ''}</span>
                    </div>
                </div>
                <div class="log-entries" style="display: none;">
                    ${logs.map(log => createLogEntryHtml(log)).join('')}
                </div>
            </div>
        `;
    }).join('');
        return;
    }

    // Group logs by local date using Luxon
    const groupedLogs = new Map();
    allUserLogs.forEach(log => {
        const dateKey = log.luxon_logged_at.toISODate();
        if (!groupedLogs.has(dateKey)) {
            groupedLogs.set(dateKey, []);
        }
        groupedLogs.get(dateKey).push(log);
    });

    // Sort dates in descending order
    const sortedDates = Array.from(groupedLogs.keys()).sort().reverse();
    
    // Generate HTML with collapsible sections
    container.innerHTML = sortedDates.map(date => {
        const logs = groupedLogs.get(date);
        const logsCount = logs.length;
        return `
            <div class="log-group" data-date="${date}">
                <div class="log-date-header collapsible">
                    <div class="header-content">
                        <span class="expand-icon">▶</span>
                        ${DateTime.fromISO(date).toFormat('LLLL d, yyyy')}
                        <span class="logs-count">(${logsCount} log${logsCount !== 1 ? 's' : ''})</span>
                    </div>
                </div>
                <div class="log-entries" style="display: none;">
                    ${logs.map(log => createLogEntryHtml(log)).join('')}
                </div>
            </div>
        `;
    }).join('');

    // Add click handlers for collapsible sections
    document.querySelectorAll('.log-date-header').forEach(header => {
        header.addEventListener('click', () => {
            const entries = header.nextElementSibling;
            const icon = header.querySelector('.expand-icon');
            const isExpanded = entries.style.display !== 'none';
            
            // Toggle visibility
            entries.style.display = isExpanded ? 'none' : 'block';
            icon.textContent = isExpanded ? '▶' : '▼';
            header.classList.toggle('expanded', !isExpanded);
        });
    });
}

        function createLogEntryHtml(log) {
            let htmlContent = `<div class="log-entry" data-log-content="${escapeHtml(JSON.stringify(log))}">
                <div class="log-meta">Logged: ${log.logged_at}</div>`;
            
            if(log.original_note) {
                htmlContent += `<div class="log-original-note"><strong>Original:</strong> ${escapeHtml(log.original_note)}</div>`;
            }
            if (log.mood_label) {
                htmlContent += `<div class="log-section"><h3>Mood</h3><span class="tag">${escapeHtml(log.mood_label)} (${log.mood_score || 'N/A'})</span></div>`;
            }
            if (log.health && log.health.length > 0) {
                htmlContent += `<div class="log-section"><h3>Health</h3><ul>`;
                log.health.forEach(h => { htmlContent += `<li>${escapeHtml(h)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.activity && log.activity.length > 0) {
                htmlContent += `<div class="log-section"><h3>Activity</h3><ul>`;
                log.activity.forEach(a => { htmlContent += `<li>${escapeHtml(a)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.diet && log.diet.length > 0) {
                htmlContent += `<div class="log-section"><h3>Diet</h3><ul>`;
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.length) {
                        items.forEach(item => {
                            htmlContent += `<li>${escapeHtml(category)}: ${escapeHtml(item)}</li>`;
                        });
                    }
                }
                htmlContent += `</ul></div>`;
            }
            htmlContent += `</div>`;
            return htmlContent;
        }

function filterLogs(searchTerm) {
    const groups = document.querySelectorAll('.log-group');
    
    groups.forEach(group => {
        const entries = group.querySelectorAll('.log-entry');
        let hasVisibleLogs = false;
        
        entries.forEach(entry => {
            const logData = JSON.parse(entry.dataset.logContent);
            const shouldShow = searchInLog(logData, searchTerm);
            entry.style.display = shouldShow ? '' : 'none';
            if (shouldShow) hasVisibleLogs = true;
        });
        
        group.style.display = hasVisibleLogs ? '' : 'none';
        
        // If searching, automatically expand groups with matches
        const entriesContainer = group.querySelector('.log-entries');
        const header = group.querySelector('.log-date-header');
        const icon = header.querySelector('.expand-icon');
        
        if (searchTerm && hasVisibleLogs) {
            entriesContainer.style.display = 'block';
            icon.textContent = '▼';
            header.classList.add('expanded');
        } else if (!searchTerm) {
            entriesContainer.style.display = 'none';
            icon.textContent = '▶';
            header.classList.remove('expanded');
        }
    });
}

        function searchInLog(log, term) {
            if (!term) return true;
            
            // Search in original note
            if (log.original_note && log.original_note.toLowerCase().includes(term)) return true;
            
            // Search in mood label
            if (log.mood_label && log.mood_label.toLowerCase().includes(term)) return true;
            
            // Search in health items
            if (log.health && log.health.some(h => h.toLowerCase().includes(term))) return true;
            
            // Search in activities
            if (log.activity && log.activity.some(a => a.toLowerCase().includes(term))) return true;
            
            // Search in diet items
            if (log.diet) {
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.some(item => 
                        item.toLowerCase().includes(term) || 
                        category.toLowerCase().includes(term)
                    )) return true;
                }
            }
            
            return false;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sideMenu = document.getElementById('sideMenu');

    hamburgerBtn.addEventListener('click', () => {
        sideMenu.classList.toggle('open');
    });

    // Optional: close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!sideMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
            sideMenu.classList.remove('open');
        }
    });
});
