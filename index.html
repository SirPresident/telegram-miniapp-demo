// ==========================================
        // 3D CAROUSEL WHEEL LOGIC (Strict Click & Drag)
        // ==========================================
        const foldersStage = document.getElementById('foldersStage');
        let hasMovedWheel = false;

        foldersStage.addEventListener("pointerdown", (e) => {
            // Only respond to primary left-click / touch
            if (e.button !== 0 && e.pointerType === "mouse") return;
            
            isWheelDragging = true;
            hasMovedWheel = false;
            wheelStartX = e.clientX;
            wheelStartRot = wheelTargetRot;
        });

window.addEventListener("pointermove", (e) => {
            if (!isWheelDragging || (e.pointerType === "mouse" && e.buttons !== 1)) {
                isWheelDragging = false;
                return;
            }

            const deltaX = e.clientX - wheelStartX;
            if (Math.abs(deltaX) > 5) hasMovedWheel = true;
            
            // Lowered sensitivity slightly (0.6) for better control over the tight arc
            let target = wheelStartRot - deltaX * 0.6; 
            
            // Prevent swiping past the first or last card (with a 15-degree rubber-band effect)
            const totalChips = document.getElementById('foldersBar')?.children.length || 1;
            const maxAngle = Math.max(0, (totalChips - 1) * folderAngleStep);
            target = Math.max(-15, Math.min(maxAngle + 15, target));
            
            wheelTargetRot = target;
        });

        const endWheelDrag = () => {
            if (!isWheelDragging) return;
            isWheelDragging = false;
            
            if (folderAngleStep > 0) {
                const nearest = Math.round(wheelTargetRot / folderAngleStep);
                let snapped = nearest * folderAngleStep;
                
                // Snap safely inside bounds when letting go
                const totalChips = document.getElementById('foldersBar')?.children.length || 1;
                const maxAngle = Math.max(0, (totalChips - 1) * folderAngleStep);
                snapped = Math.max(0, Math.min(maxAngle, snapped));
                
                wheelTargetRot = snapped;
            }
            setTimeout(() => { hasMovedWheel = false; }, 50);
        };

        // Window listener ensures letting go of the mouse anywhere releases the drag
        window.addEventListener("pointerup", endWheelDrag);
        window.addEventListener("pointercancel", endWheelDrag);

        foldersStage.addEventListener("pointerup", endWheelDrag);
        foldersStage.addEventListener("pointercancel", endWheelDrag);

function animateFoldersWheel() {
            const foldersBar = document.getElementById('foldersBar');
            if (!foldersBar) return;

            wheelCurrentRot += (wheelTargetRot - wheelCurrentRot) * 0.13;
            
            // We push the whole stage back by -radius so the front card stays exactly its true size,
            // while the side cards curve elegantly away into the background.
            foldersBar.style.transform = `translateZ(-190px) rotateY(${-wheelCurrentRot}deg)`;

            Array.from(foldersBar.children).forEach((chip, index) => {
                const angle = index * folderAngleStep;
                
                // Simple difference (no 360 wrap around)
                let diff = angle - wheelCurrentRot;
                let absDiff = Math.abs(diff);

                // Sharp opacity drop-off: Cards fade out completely when they are ~75 degrees away from center
                chip.style.opacity = Math.max(0.1, 1 - Math.pow(absDiff / 75, 1.5));
            });

            wheelRAF = requestAnimationFrame(animateFoldersWheel);
        }

        // Quests Segmented Controls
        document.querySelectorAll('#quest-status-tabs .q-tab').forEach(btn => btn.addEventListener('click', (e) => { document.querySelectorAll('#quest-status-tabs .q-tab').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); }));
        document.querySelectorAll('#quest-type-tabs .q-tab').forEach(btn => btn.addEventListener('click', (e) => { document.querySelectorAll('#quest-type-tabs .q-tab').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); }));

        // 3D Cube Navigation
        function initTabs() {
            const syncNoteWidth = () => {
                const nav = document.querySelector('.capsule-tabs');
                if(nav) document.body.style.setProperty('--match-width', `${nav.offsetWidth}px`);
            };
            window.addEventListener('resize', syncNoteWidth);
            syncNoteWidth();
            const tabs = [
                { btn: document.getElementById('tab-home') },      // Index 0
                { btn: document.getElementById('tab-analytics') }, // Index 1
                { btn: document.getElementById('tab-logs') },      // Index 2 (History)
                { btn: document.getElementById('tab-quests') },    // Index 3
                { btn: document.getElementById('tab-profile') }    // Index 4 (Profile + Skills)  
            ];

            const slides = document.querySelectorAll('.slide');
            let isAnimating = false;

            tabs.forEach((t, i) => t.btn.classList.toggle('active', i === window.currentTabIndex));
            slides.forEach((slide, i) => {
                if (i === window.currentTabIndex) { slide.style.display = 'flex'; slide.style.transform = 'translateZ(0) rotateY(0) translateZ(0)'; } 
                else { slide.style.display = 'none'; }
            });

            function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

            function animateCube(oldIndex, newIndex) {
                isAnimating = true;
                const oldSlide = slides[oldIndex];
                const newSlide = slides[newIndex];
                const d = document.getElementById('stage').clientWidth / 2;
                const direction = newIndex > oldIndex ? 1 : -1; 

                newSlide.style.display = 'flex';

                let startTimestamp = null;
                const duration = 650; 

                function step(timestamp) {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const e = easeInOutCubic(progress);

                    oldSlide.style.transform = `translateZ(${-d}px) rotateY(${-90 * direction * e}deg) translateZ(${d}px)`;
                    oldSlide.style.filter = `brightness(${1 - 0.5 * e})`;

                    newSlide.style.transform = `translateZ(${-d}px) rotateY(${90 * direction * (1 - e)}deg) translateZ(${d}px)`;
                    newSlide.style.filter = `brightness(${0.5 + 0.5 * e})`;

                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        oldSlide.style.display = 'none';
                        oldSlide.style.transform = ''; oldSlide.style.filter = '';
                        newSlide.style.transform = `translateZ(0) rotateY(0) translateZ(0)`; newSlide.style.filter = '';
                        
                        window.currentTabIndex = newIndex;
                        isAnimating = false;

                        if (newIndex === 1 && isDataLoaded) {
                            requestAnimationFrame(() => { setupChartAndSlider(); });
                        }
                        // Trigger Level Up Animations if sliding to index 4
                        if (newIndex === 4 && isDataLoaded) {
                            requestAnimationFrame(() => { triggerLevelUpAnimations(); });
                        }
                        if (newIndex === 4 && isDataLoaded) {
                            requestAnimationFrame(() => { triggerLevelUpAnimations(); });
                        }
                        
                        // Sync Note widget width after the tab fully changes
                        setTimeout(syncNoteWidth, 300);
                    }
                }
                requestAnimationFrame(step);
            }

            tabs.forEach((tab, index) => {
                tab.btn.addEventListener('click', () => {
                    if (index === window.currentTabIndex || isAnimating) return; 
                    tabs.forEach((t, i) => t.btn.classList.toggle('active', i === index));
                    animateCube(window.currentTabIndex, index);
                });
            });
        }

        // ==========================================
        // LEVEL UP LOGIC
        // ==========================================
        function getSkillIcon(skillName) {
            return KNOWN_SKILL_ICONS[skillName.toLowerCase()] || '✨';
        }

        function getSkillProgress(totalXP) {
            if (totalXP <= 0) return { level: 0, xpInCurrentLevel: 0, xpNeededForNext: 10, progressPercent: 0 };
            let level = 1; let remainingXP = totalXP;
            while (true) {
                const costToNext = 10 * level;
                if (remainingXP >= costToNext) {
                    remainingXP -= costToNext; level++;
                } else {
                    return {
                        level: level, xpInCurrentLevel: remainingXP,
                        xpNeededForNext: costToNext,
                        progressPercent: Math.min(100, Math.round((remainingXP / costToNext) * 100))
                    };
                }
            }
        }

function calculateSkillLevels() {
            userSkills = {};
            
            // INSTEAD of looping through logs, we just copy the exact totals the backend sent us!
            Object.entries(backendSkillsData).forEach(([skillName, skillInfo]) => {
                const cleanName = skillName.toLowerCase().trim();
                userSkills[cleanName] = { totalXP: skillInfo.total_xp };
            });
// Attach the timestamp of when each skill last gained XP
            allUserLogs.forEach(log => {
                const skills = log.skills_xp_gained || {};
                Object.keys(skills).forEach(skillName => {
                    const cleanName = skillName.toLowerCase().trim();
                    if (userSkills[cleanName]) {
                        const logTime = log.luxon_logged_at ? log.luxon_logged_at.toMillis() : 0;
                        userSkills[cleanName].lastGainedAt = Math.max(userSkills[cleanName].lastGainedAt || 0, logTime);
                    }
                });
            });

            // Load previous state to detect changes for animations
            const storedStateStr = localStorage.getItem('liquidGlass_skillsState');
            const isFirstLoad = !storedStateStr;
            const storedState = JSON.parse(storedStateStr || '{}');
            const stateToSave = { ...storedState };

            Object.keys(userSkills).forEach(skillName => {
                const progress = getSkillProgress(userSkills[skillName].totalXP);
                const previous = storedState[skillName];
                
                let stateFlags = { gainedXP: false, leveledUp: false, oldLevel: progress.level, oldPercent: progress.progressPercent, oldXpText: `${progress.xpInCurrentLevel} / ${progress.xpNeededForNext} XP` };

                if (!isFirstLoad) {
                    if (previous && previous.totalXP < userSkills[skillName].totalXP) {
                        stateFlags.gainedXP = true;
                        stateFlags.oldLevel = previous.level;
                        stateFlags.oldPercent = previous.progressPercent;
                        stateFlags.oldXpText = `${previous.xpInCurrentLevel} / ${previous.xpNeededForNext} XP`;
                        if (progress.level > previous.level) stateFlags.leveledUp = true;
                    } else if (!previous && userSkills[skillName].totalXP > 0) {
                        stateFlags.gainedXP = true;
                        stateFlags.oldLevel = 0; stateFlags.oldPercent = 0;
                        stateFlags.oldXpText = `0 / 10 XP`;
                        if (progress.level > 0) stateFlags.leveledUp = true;
                    }
                }

                if (!stateFlags.gainedXP) {
                    stateToSave[skillName] = { totalXP: userSkills[skillName].totalXP, level: progress.level, progressPercent: progress.progressPercent, xpInCurrentLevel: progress.xpInCurrentLevel, xpNeededForNext: progress.xpNeededForNext };
                }

                userSkills[skillName] = {
                    ...userSkills[skillName], ...progress, ...stateFlags,
                    icon: getSkillIcon(skillName),
                    displayName: skillName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
                };
            });
            localStorage.setItem('liquidGlass_skillsState', JSON.stringify(stateToSave));
        }

        function displaySkills() {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = '';
            const skillEntries = Object.entries(userSkills);

            if (!skillEntries.length) {
                container.innerHTML = `<div class="empty-placeholder">Log habits to start gaining XP!</div>`;
                return;
            }

            // Sort by most recently gained XP first (fallback to highest total XP)
            skillEntries.sort((a, b) => {
                const timeA = a[1].lastGainedAt || 0;
                const timeB = b[1].lastGainedAt || 0;
                if (timeB !== timeA) return timeB - timeA;
                return b[1].totalXP - a[1].totalXP;
            });

            skillEntries.forEach(([skillName, data]) => {
                const card = document.createElement('div');
                card.className = 'skill-item';
                card.id = `skill-${skillName}`;

                // Set flags and stash target data for the animation reader
                if (data.leveledUp) card.dataset.anim = 'celebrate';
                else if (data.gainedXP) card.dataset.anim = 'vibrate';

                card.dataset.targetPercent = data.progressPercent;
                card.dataset.targetLevel = data.level;
                card.dataset.targetXpText = `${data.xpInCurrentLevel} / ${data.xpNeededForNext} XP`;
                card.dataset.skillKey = skillName;

                // Render the OLD state initially if an animation is pending
                const renderLevel = (data.gainedXP || data.leveledUp) ? data.oldLevel : data.level;
                const renderPercent = (data.gainedXP || data.leveledUp) ? data.oldPercent : data.progressPercent;
                const renderXpText = (data.gainedXP || data.leveledUp) ? data.oldXpText : `${data.xpInCurrentLevel} / ${data.xpNeededForNext} XP`;

                card.innerHTML = `
                    <div class="skill-header">
                        <span class="skill-icon">${data.icon}</span>
                        <span class="skill-name">${escapeHtml(data.displayName)}</span>
                        <span class="skill-level">Lvl <span class="lvl-num">${renderLevel}</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${renderPercent}%;"></div>
                    </div>
                    <div class="skill-xp-info">${renderXpText}</div>
                `;
                container.appendChild(card);
            });
        }

// ========================================================
        // ⚙️ ANIMATION CONTROL PANEL (Adjust all timings here!)
        // ========================================================
        const SKILL_ANIM_SETTINGS = {
            shakeSpeed: 350,        // Speed of 1 single shake (in milliseconds)
            shakeCount: 4,          // How many times it shakes for normal XP
            progressDuration: 1600, // Time for the progress bar to fill (in milliseconds)
            levelRushDuration: 900, // Time for bar to rush to 100% on Level Up (in milliseconds)
            levelRefillDuration: 1600, // Time for bar to fill in the new level (in milliseconds)
            pauseBuffer: 100        // Small natural pause between animations (in milliseconds)
        };

        function triggerLevelUpAnimations() {
            const cards = document.querySelectorAll('.skill-item[data-anim]');
            if (!cards.length) return;

            // Sync JS timings to CSS variables automatically
            document.documentElement.style.setProperty('--shake-speed', `${SKILL_ANIM_SETTINGS.shakeSpeed}ms`);
            document.documentElement.style.setProperty('--shake-count', SKILL_ANIM_SETTINGS.shakeCount);

            // Automatically calculate total phase durations
            const totalVibrationTime = SKILL_ANIM_SETTINGS.shakeSpeed * SKILL_ANIM_SETTINGS.shakeCount;
            const totalRegularCooldown = totalVibrationTime + SKILL_ANIM_SETTINGS.progressDuration + SKILL_ANIM_SETTINGS.pauseBuffer;

            let stateToSave = JSON.parse(localStorage.getItem('liquidGlass_skillsState') || '{}');

            cards.forEach(card => {
                const animType = card.dataset.anim;
                const skillKey = card.dataset.skillKey;
                const bar = card.querySelector('.progress-bar');
                const levelNum = card.querySelector('.lvl-num');
                const xpText = card.querySelector('.skill-xp-info');

                const targetPercent = card.dataset.targetPercent;
                const targetLevel = card.dataset.targetLevel;
                const targetXpText = card.dataset.targetXpText;

                // Case 1: Normal XP Gain
                if (animType === 'vibrate') {
                    card.classList.add('card-on-fire');
                    card.classList.add('anim-vibrate-long');

                    // 1. Wait for vibration to fully finish before moving the bar
                    setTimeout(() => {
                        card.classList.remove('anim-vibrate-long');

                        bar.style.transition = `width ${SKILL_ANIM_SETTINGS.progressDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                        bar.style.width = targetPercent + '%';
                        xpText.textContent = targetXpText;
                    }, totalVibrationTime);

                    // 2. Cool down fire effect after bar finishes
                    setTimeout(() => {
                        card.classList.remove('card-on-fire');
                    }, totalRegularCooldown);

                    delete card.dataset.anim;
                    
                    stateToSave[skillKey] = {
                        totalXP: userSkills[skillKey].totalXP, level: userSkills[skillKey].level,
                        progressPercent: userSkills[skillKey].progressPercent,
                        xpInCurrentLevel: userSkills[skillKey].xpInCurrentLevel, xpNeededForNext: userSkills[skillKey].xpNeededForNext
                    };
                    localStorage.setItem('liquidGlass_skillsState', JSON.stringify(stateToSave));
                } 

                // Case 2: Level Up
                else if (animType === 'celebrate') {
                    card.classList.add('card-on-fire');
                    card.classList.add('anim-vibrate-infinite');
                    
                    xpText.innerHTML = `<span class="tap-claim-badge">🔥 Tap to Level Up!</span>`;
                    card.style.cursor = 'pointer';

                    const claimLevelUp = () => {
                        card.removeEventListener('click', claimLevelUp);
                        card.classList.remove('anim-vibrate-infinite');
                        card.classList.add('anim-celebrate');
                        card.style.cursor = 'default';

                        // 1. Rush bar to 100%
                        bar.style.transition = `width ${SKILL_ANIM_SETTINGS.levelRushDuration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                        bar.style.width = '100%';
                        xpText.textContent = 'Level Up!';

                        // 2. Pop level number, reset, and fill to new XP
                        setTimeout(() => {
                            levelNum.textContent = targetLevel;
                            levelNum.classList.add('anim-level-pop');

                            bar.style.transition = 'none';
                            bar.style.width = '0%';
                            void bar.offsetWidth; // Force reflow

                            bar.style.transition = `width ${SKILL_ANIM_SETTINGS.levelRefillDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                            bar.style.width = targetPercent + '%';
                            xpText.textContent = targetXpText;

                            // Cool down
                            setTimeout(() => {
                                card.classList.remove('card-on-fire');
                                card.classList.remove('anim-celebrate');
                            }, SKILL_ANIM_SETTINGS.levelRefillDuration + SKILL_ANIM_SETTINGS.pauseBuffer);

                            stateToSave[skillKey] = {
                                totalXP: userSkills[skillKey].totalXP, level: userSkills[skillKey].level,
                                progressPercent: userSkills[skillKey].progressPercent,
                                xpInCurrentLevel: userSkills[skillKey].xpInCurrentLevel, xpNeededForNext: userSkills[skillKey].xpNeededForNext
                            };
                            localStorage.setItem('liquidGlass_skillsState', JSON.stringify(stateToSave));
                            delete card.dataset.anim;
                        }, SKILL_ANIM_SETTINGS.levelRushDuration + SKILL_ANIM_SETTINGS.pauseBuffer);
                    };

                    card.addEventListener('click', claimLevelUp);
                }
            });
        }

// ==========================================
        // HOME TAB NOTE WIDGET LOGIC
        // ==========================================
        const noteWidget = document.getElementById('noteWidget');
        const noteInput = document.getElementById('noteInput');
        const sendBtn = document.getElementById('sendBtn');
        const dismissBtn = document.getElementById('dismissBtn');

        if (noteInput && sendBtn) {
            noteInput.addEventListener('input', function() {
                const oldHeight = this.style.height;
                this.style.height = '1px'; 
                const requiredHeight = this.scrollHeight;
                this.style.height = oldHeight; 

                const uiOffset = 80; 
                let newContainerHeight = requiredHeight + uiOffset;
                const minHeight = 140;
                const maxHeight = window.innerHeight * 0.75; 
                
                newContainerHeight = Math.max(minHeight, Math.min(newContainerHeight, maxHeight));
                document.body.style.setProperty('--note-height', `${newContainerHeight}px`);
            });

            sendBtn.addEventListener('click', async () => {
                const noteText = noteInput.value.trim();
                if (!noteText) return; 

                if (!telegramUser || !telegramUser.id) {
                    alert("Telegram User ID missing. Please open inside Telegram.");
                    return;
                }
                
                const leoImg = document.getElementById('leoImage');
                const rect = leoImg.getBoundingClientRect();
                const scale = 2;
                const scaledHeight = rect.height * scale;
                
                const targetLeft = rect.left + (rect.width / 2.07);
                const distFromBottom = window.innerHeight - rect.bottom;
                const targetBottom = distFromBottom + (scaledHeight * 0.5);
                
                document.body.style.setProperty('--target-left', `${targetLeft}px`);
                document.body.style.setProperty('--target-bottom', `${targetBottom}px`);

                // 1. Start thinking animation
                noteWidget.classList.add('is-processing');
                leoImg.src = 'assets/Leo/Processing-Leo.png';
                leoImg.classList.add('processing-mode');

                const payload = {
                    telegram_user_id: telegramUser.id,
                    telegram_username: telegramUser.username || '',
                    note_text: noteText
                };

                const resultContent = document.getElementById('resultContent');

                try {
                    // 2. Send to Django & wait at least 1.2s so the animation feels natural
                    const [res] = await Promise.all([
                        fetch(`${BACKEND_URL_BASE}/api/process_text_note/`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }),
                        new Promise(resolve => setTimeout(resolve, 1200))
                    ]);

                    const data = await res.json();

                    // 3. Build UI matching bot's construct_reply_and_send logic
                    if (data.error) {
                        resultContent.innerHTML = `
                            <div class="result-title" style="color: #ef4444;">⚠️ Note Error</div>
                            <div class="result-section"><p>${escapeHtml(data.error)}</p></div>
                        `;
                    } else {
                        let html = `<div class="result-title">📝 Note processed!</div>`;

                        // Mood
                        if (data.mood) {
                            html += `<div class="result-section"><p>😊 <b>Mood:</b> ${escapeHtml(data.mood)}</p></div>`;
                        }

                        // Health, Diet, Activity
                        const metaItems = [];
                        if (data.health_items?.length) metaItems.push(`<p>❤️ <b>Health:</b> ${data.health_items.map(escapeHtml).join(', ')}</p>`);
                        if (data.diet_items?.length) metaItems.push(`<p>🍜 <b>Diet:</b> ${data.diet_items.map(escapeHtml).join(', ')}</p>`);
                        if (data.activity_items?.length) metaItems.push(`<p>⚡ <b>Activities:</b> ${data.activity_items.map(escapeHtml).join(', ')}</p>`);
                        if (metaItems.length) {
                            html += `<div class="result-section">${metaItems.join('')}</div>`;
                        }

                        // Specific XP Gained
                        if (data.specific_xp_gained?.length) {
                            const xpLines = data.specific_xp_gained.map(i => 
                                `<p>${escapeHtml(i.icon || '⚡')} <b>${escapeHtml(i.name)}:</b> +${i.amount} XP</p>`
                            ).join('');
                            html += `<div class="result-section"><p style="font-weight:700; margin-bottom:2px;">✨ XP Gained:</p>${xpLines}</div>`;
                        }

                        // Newly Unlocked Skills
                        if (data.newly_unlocked_skills?.length) {
                            const unlockLines = data.newly_unlocked_skills.map(i => 
                                `<p>${escapeHtml(i.icon || '🎉')} Unlocked: <b>${escapeHtml(i.name)}</b>!</p>`
                            ).join('');
                            html += `<div class="result-section" style="color:#10b981;"><p style="font-weight:700; margin-bottom:2px;">🎉 New Skill Unlocked:</p>${unlockLines}</div>`;
                        }

                        // Leveled Up Skills
                        if (data.leveled_up_skills?.length) {
                            const lvlLines = data.leveled_up_skills.map(i => 
                                `<p>${escapeHtml(i.icon || '🚀')} <b>${escapeHtml(i.name)}</b> reached <b>Lvl ${i.new_level}</b>!</p>`
                            ).join('');
                            html += `<div class="result-section level-up" style="color:#10b981;"><p style="font-weight:700; margin-bottom:2px;">🚀 Level Up:</p>${lvlLines}</div>`;
                        }

                        resultContent.innerHTML = html;

                        // 4. Silently refresh all app data (History, Analytics, & Profile XP)
                        fetchAllLogsAndSetupChart();
                    }

                } catch (err) {
                    console.error('Note process error:', err);
                    resultContent.innerHTML = `
                        <div class="result-title" style="color: #ef4444;">⚠️ Network Error</div>
                        <div class="result-section"><p>Could not connect to processing server.</p></div>
                    `;
                } finally {
                    // 5. Reveal result card and revert Leo avatar
                    noteWidget.classList.remove('is-processing');
                    noteWidget.classList.add('is-result');
                    noteInput.value = '';
                    document.body.style.setProperty('--note-height', `140px`);
                    
                    leoImg.src = 'assets/Leo/Leo.png';
                    leoImg.classList.remove('processing-mode');
                }
            });

            dismissBtn.addEventListener('click', () => {
                noteWidget.classList.remove('is-result');
                noteWidget.classList.add('is-dismissing');

                setTimeout(() => {
                    noteWidget.classList.remove('is-dismissing');
                    noteWidget.classList.add('is-respawning');

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            noteWidget.classList.remove('is-respawning');
                        });
                    });
                }, 800); 
            });
        }

// ==========================================
        // PROFILE SYNCHRONIZED PUSH INTERACTION
        // ==========================================
        const openLevelUpBtn = document.getElementById('openLevelUpBtn');
        const closeLevelUpBtn = document.getElementById('closeLevelUpBtn');
        const levelUpSubPage = document.getElementById('levelUpSubPage');
        const profileMainView = document.getElementById('profileMainView');

        if (openLevelUpBtn && levelUpSubPage && profileMainView) {
            // Push Profile LEFT and Level Up IN from RIGHT
            openLevelUpBtn.addEventListener('click', () => {
                profileMainView.classList.add('is-pushed-left');
                levelUpSubPage.classList.add('is-open');
                
                setTimeout(() => {
                    triggerLevelUpAnimations();
                }, 250);
            });

            // Push Level Up back to RIGHT and Profile back IN from LEFT
            closeLevelUpBtn.addEventListener('click', () => {
                profileMainView.classList.remove('is-pushed-left');
                levelUpSubPage.classList.remove('is-open');
            });
        }

        initTabs();
    </script>
</body>
