        function getWeekMoodData(weekIndex) {
            const logs = weekSegments[weekIndex];
            if (!logs?.length) return [];

            const start = logs[0].luxon_logged_at.startOf('week');

            return Array.from({ length: 7 }, (_, dayIndex) => {
                const day = start.plus({ days: dayIndex });
                const logsForDay = dailyLogs.get(day.toISODate()) || [];
                const scores = logsForDay.filter(log => log.mood_score != null);

                return {
                    x: day.toISODate(),
                    y: scores.length
                        ? scores.reduce((sum, log) => sum + log.mood_score, 0) /
                            scores.length
                        : null
                };
            });
        }

        function makeGradient(context) {
            const gradient = context.createLinearGradient(0, 0, 0, 280);
            const styles = themeStyles();

            gradient.addColorStop(
                0,
                styles.getPropertyValue('--chart-grad-start').trim()
            );
            gradient.addColorStop(
                1,
                styles.getPropertyValue('--chart-grad-end').trim()
            );

            return gradient;
        }

        function applyChartTheme() {
            if (!moodChartInstance) return;

            const chart = moodChartInstance;
            const styles = themeStyles();
            const read = name => styles.getPropertyValue(name).trim();

            chart.data.datasets[0].borderColor = read('--chart-line');
            chart.data.datasets[0].backgroundColor = makeGradient(chart.ctx);

            chart.options.scales.x.ticks.color = read('--text-muted');
            chart.options.scales.y.ticks.color = read('--text-muted');
            chart.options.scales.y.grid.color = read('--border-color');

            chart.options.plugins.tooltip.backgroundColor = read('--surface-strong');
            chart.options.plugins.tooltip.titleColor = read('--text-color');
            chart.options.plugins.tooltip.bodyColor = read('--text-color');
            chart.options.plugins.tooltip.borderColor = read('--border-color');

            updateChartPointColors();
        }

        function updateChartPointColors() {
            if (!moodChartInstance) return;

            const [min, max] = moodRange;
            const base = themeValue('--chart-line');
            const success = themeValue('--success');

            moodChartInstance.data.datasets[0].pointBackgroundColor =
                moodChartInstance.data.datasets[0].data.map(point =>
                    point.y != null && point.y >= min && point.y <= max
                        ? success
                        : base
                );
        }

        function updateSliderLabels() {
            if (!slider?.noUiSlider) return;

            const handles = slider.querySelectorAll('.noUi-handle');
            handles[0]?.setAttribute('aria-label', t('minimumMood'));
            handles[1]?.setAttribute('aria-label', t('maximumMood'));
        }

        function setupChartAndSlider() {
            const canvas = document.getElementById('moodScoreChart');
            const context = canvas.getContext('2d');

            const thresholdPlugin = {
                id: 'moodThresholds',
                beforeDraw(chart) {
                    if (!chart.chartArea) return;

                    const { left, right } = chart.chartArea;
                    const y = chart.scales.y;
                    const ctx = chart.ctx;

                    ctx.save();
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);

                    [
                        [moodRange[0], themeValue('--danger')],
                        [moodRange[1], themeValue('--success')]
                    ].forEach(([value, color]) => {
                        ctx.strokeStyle = color;
                        ctx.beginPath();
                        ctx.moveTo(left, y.getPixelForValue(value));
                        ctx.lineTo(right, y.getPixelForValue(value));
                        ctx.stroke();
                    });

                    ctx.restore();
                }
            };

            const syncSliderHeight = {
                id: 'syncSliderHeight',
                afterLayout(chart) {
                    if (!chart.chartArea) return;

                    const rail = document.getElementById('slider');
                    const top = chart.chartArea.top;
                    const height = chart.chartArea.bottom - top;

                    rail.style.marginTop = `${top}px`;
                    rail.style.height = `${Math.max(1, height)}px`;
                }
            };

            moodChartInstance = new Chart(context, {
                type: 'line',
                data: {
                    datasets: [{
                        label: t('moodChart'),
                        data: [],
                        fill: true,
                        backgroundColor: makeGradient(context),
                        borderColor: themeValue('--chart-line'),
                        borderWidth: 2.5,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointHitRadius: 14,
                        tension: 0.32,
                        spanGaps: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: {
                        mode: 'nearest',
                        intersect: false
                    },
                    scales: {
                        x: {
                            type: 'time',
                            adapters: {
                                date: { locale: currentLanguage }
                            },
                            time: {
                                unit: 'day',
                                tooltipFormat: 'MMM dd yyyy',
                                displayFormats: { day: 'dd' }
                            },
                            grid: { display: false },
                            border: { display: false },
                            ticks: {
                                color: themeValue('--text-muted'),
                                font: { family: '-apple-system, system-ui' },
                                maxRotation: 0
                            }
                        },
                        y: {
                            min: 1,
                            max: 5,
                            border: { display: false },
                            grid: {
                                color: themeValue('--border-color')
                            },
                            ticks: {
                                stepSize: 1,
                                color: themeValue('--text-muted'),
                                callback(value) {
                                    return MOOD_EMOJIS[value] || value;
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            padding: 12,
                            cornerRadius: 10,
                            borderWidth: 1,
                            displayColors: false,
                            callbacks: {
                                label(context) {
                                    return `${t('moodChart')}: ${
                                        formatNumber(context.parsed.y)
                                    } / ${formatNumber(5)}`;
                                }
                            }
                        },
                        zoom: {
                            pan: {
                                enabled: typeof window.Hammer !== 'undefined',
                                mode: 'x'
                            },
                            zoom: {
                                wheel: { enabled: false },
                                pinch: { enabled: false }
                            }
                        }
                    }
                },
                plugins: [thresholdPlugin, syncSliderHeight]
            });

            slider = document.getElementById('slider');

            noUiSlider.create(slider, {
                start: moodRange,
                connect: true,
                orientation: 'vertical',
                direction: 'rtl',
                range: { min: 1, max: 5 },
                step: 0.1,
                tooltips: false
            });

            slider.noUiSlider.on('update', values => {
                moodRange = values.map(Number);

                if (sliderUpdateRAF) {
                    cancelAnimationFrame(sliderUpdateRAF);
                }

                sliderUpdateRAF = requestAnimationFrame(() => {
                    sliderUpdateRAF = null;
                    updateChartPointColors();

                    if (activeView === 'analytics') {
                        moodChartInstance?.update('none');
                        updatePanels();
                    }
                });
            });

            updateSliderLabels();
            applyChartTheme();
        }

        function renderAnalytics() {
            const status = document.getElementById('analyticsStatus');
            const content = document.getElementById('analyticsContent');

            if (dataState !== 'ready') {
                content.hidden = true;
                status.hidden = false;
                status.innerHTML = statusMarkup();
                return;
            }

            if (!weekSegments.length) {
                content.hidden = true;
                status.hidden = false;
                status.textContent = t('noActivity');
                return;
            }

            if (!window.Chart || !window.noUiSlider) {
                content.hidden = true;
                status.hidden = false;
                status.textContent = t('chartError');
                return;
            }

            status.hidden = true;
            content.hidden = false;

            try {
                if (!moodChartInstance) setupChartAndSlider();

                moodChartInstance.resize();
                updateAnalyticsView();
            } catch (error) {
                console.error('Chart initialization error:', error);

                moodChartInstance?.destroy();
                moodChartInstance = null;

                slider?.noUiSlider?.destroy();
                slider = null;

                content.hidden = true;
                status.hidden = false;
                status.textContent = t('chartError');
            }
        }

        function updateAnalyticsView() {
            if (!moodChartInstance || !weekSegments[idx]?.length) return;

            const start = weekSegments[idx][0].luxon_logged_at.startOf('week');
            const end = start.plus({ days: 6 });

            moodChartInstance.data.datasets[0].label = t('moodChart');
            moodChartInstance.data.datasets[0].data = getWeekMoodData(idx);
            moodChartInstance.options.scales.x.min = start.toISODate();
            moodChartInstance.options.scales.x.max = end.toISODate();

            document.getElementById('segmentLabel').textContent =
                `${start.setLocale(currentLanguage).toFormat('LLL d')} – ` +
                end.setLocale(currentLanguage).toFormat('LLL d, yyyy');

            document.getElementById('prevWeekBtn').disabled = idx === 0;
            document.getElementById('nextWeekBtn').disabled =
                idx === weekSegments.length - 1;

            applyChartTheme();
            moodChartInstance.update('none');
            updatePanels();
        }

        // ------------------------------------------------------------
        // Analytics summary panels
        // ------------------------------------------------------------

        function updatePanels() {
            const [minMood, maxMood] = moodRange;
            const currentWeek = weekSegments[idx] || [];

            let logsToUse;

            if (panelRange === 'week') {
                logsToUse = currentWeek;
            } else if (panelRange === 'month') {
                const anchor = currentWeek[0]?.luxon_logged_at;

                logsToUse = anchor
                    ? allUserLogs.filter(log =>
                        log.luxon_logged_at.month === anchor.month &&
                        log.luxon_logged_at.year === anchor.year
                    )
                    : [];
            } else {
                logsToUse = allUserLogs;
            }

            const groups = new Map();

            logsToUse.forEach(log => {
                if (!groups.has(log._dateKey)) {
                    groups.set(log._dateKey, {
                        logs: [],
                        score: 0,
                        count: 0
                    });
                }

                const group = groups.get(log._dateKey);
                group.logs.push(log);

                if (log.mood_score != null) {
                    group.score += log.mood_score;
                    group.count++;
                }
            });

            relevantPanelLogs = [];

            groups.forEach(group => {
                if (!group.count) return;

                const average = group.score / group.count;

                if (average >= minMood && average <= maxMood) {
                    relevantPanelLogs.push(...group.logs);
                }
            });

            const dietItems = [];
            const healthItems = [];
            const activityItems = [];

            relevantPanelLogs.forEach(log => {
                Object.entries(log.diet).forEach(([category, items]) => {
                    items.forEach(item => dietItems.push(`${category}: ${item}`));
                });

                healthItems.push(...log.health);
                activityItems.push(...log.activity);
            });

            function renderPanel(id, items, type) {
                const counts = new Map();

                items.forEach(item => {
                    counts.set(item, (counts.get(item) || 0) + 1);
                });

                const sorted = Array.from(counts.entries())
                    .sort((a, b) => b[1] - a[1]);

                document.getElementById(id).innerHTML = sorted.length
                    ? sorted.map(([item, count]) => `
                        <button
                            class="panel-item"
                            type="button"
                            data-item="${escapeHtml(item)}"
                            data-type="${type}"
                        >
                            <span>${escapeHtml(item)}</span>
                            <span class="count-pill">
                                ${formatNumber(count)}×
                            </span>
                        </button>
                    `).join('')
                    : `
                        <div class="empty-placeholder">
                            ${text('noneRecorded')}
                        </div>
                    `;
            }

            renderPanel('dietPanel', dietItems, 'diet');
            renderPanel('healthPanel', healthItems, 'health');
            renderPanel('activityPanel', activityItems, 'activity');

            if (selectedPanelDetail) renderRelevantLogs(false);
        }

        function renderRelevantLogs(scroll = true) {
            const container = document.getElementById('logsContainer');

            if (!selectedPanelDetail) {
                container.innerHTML = '';
                return;
            }

            const { item, type } = selectedPanelDetail;

            const matched = relevantPanelLogs.filter(log => {
                if (type === 'diet') {
                    return Object.entries(log.diet).some(([category, items]) =>
                        items.some(value => `${category}: ${value}` === item)
                    );
                }

                return log[type]?.includes(item);
            });

            container.innerHTML = `
                <div class="detail-heading">
                    <h3>${escapeHtml(item)}</h3>
                    <button
                        id="closeDetailLogs"
                        class="nav-btn"
                        type="button"
                    >
                        ${text('clear')}
                    </button>
                </div>

                ${matched.length ? `
                    <div class="log-entries">
                        ${matched.slice().reverse().map(createLogEntryHtml).join('')}
                    </div>
                ` : `
                    <div class="empty-placeholder">
                        ${text('noLogsMatched')}
                    </div>
                `}
            `;

            if (scroll) {
                container.scrollIntoView({
                    behavior: reducedMotion.matches ? 'auto' : 'smooth',
                    block: 'nearest'
                });
            }
        }

        function initAnalytics() {
            document.getElementById('prevWeekBtn')
                .addEventListener('click', () => {
                    if (idx > 0) {
                        idx--;
                        updateAnalyticsView();
                    }
                });

            document.getElementById('nextWeekBtn')
                .addEventListener('click', () => {
                    if (idx < weekSegments.length - 1) {
                        idx++;
                        updateAnalyticsView();
                    }
                });

            document.getElementById('panelRangeSelect')
                .addEventListener('change', event => {
                    panelRange = event.target.value;
                    updatePanels();
                });

            document.getElementById('summaryPanels')
                .addEventListener('click', event => {
                    const button = event.target.closest('.panel-item');
                    if (!button) return;

                    selectedPanelDetail = {
                        item: button.dataset.item,
                        type: button.dataset.type
                    };

                    renderRelevantLogs();
                });

            document.getElementById('logsContainer')
                .addEventListener('click', event => {
                    if (event.target.closest('#closeDetailLogs')) {
                        selectedPanelDetail = null;
                        renderRelevantLogs(false);
                    }
                });
        }

        // ------------------------------------------------------------
        // Skill progression
        // ------------------------------------------------------------

        function calculateSkillLevels() {
            Object.values(SKILLS_CONFIG).forEach(config => {
                config.currentXP = 0;
                config.currentLevel = 0;
                config.xpTowardsNext = 0;
                config.xpNeeded = config.baseXP;
            });

            allUserLogs.forEach(log => {
                Object.entries(SKILLS_CONFIG).forEach(([skill, config]) => {
                    config.currentXP += log[`${skill}_xp_gained`] || 0;
                });
            });

            Object.values(SKILLS_CONFIG).forEach(config => {
                let level = 0;
                let remaining = config.currentXP;

                // Equivalent to the original cumulative XP formula,
                // without repeatedly recalculating earlier levels.
                let needed = Math.floor(
                    config.baseXP * Math.pow(level + 1, config.exponent - 1)
                );

                while (needed > 0 && remaining >= needed) {
                    remaining -= needed;
                    level++;

                    needed = Math.floor(
                        config.baseXP *
                        Math.pow(level + 1, config.exponent - 1)
                    );
                }

                config.currentLevel = level;
                config.xpTowardsNext = remaining;
                config.xpNeeded = needed;
            });
        }

        function displaySkills() {
            const container = document.getElementById('skillsContainer');
            const focusSection = document.getElementById('skillFocusSection');

            focusSection.hidden = dataState !== 'ready';

            if (dataState !== 'ready') {
                container.innerHTML = statusMarkup();
                return;
            }

            const earnedSkills = Object.entries(SKILLS_CONFIG)
                .filter(([, config]) => config.currentXP > 0);

            if (!earnedSkills.length) {
                container.innerHTML = `
                    <div class="status-card">${text('logHabits')}</div>
                `;
                return;
            }

            container.innerHTML = earnedSkills.map(([skill, config]) => {
                const progress = config.xpNeeded > 0
                    ? Math.min(
                        100,
                        config.xpTowardsNext / config.xpNeeded * 100
                    )
                    : 0;

                return `
                    <article class="skill-item">
                        <div class="skill-header">
                            <div class="skill-title-group">
                                <span class="skill-icon" aria-hidden="true">
                                    ${config.icon}
                                </span>
                                <span class="skill-name">
                                    ${text(skill)}
                                </span>
                            </div>

                            <span class="skill-level">
                                ${text('level')}
                                ${formatNumber(config.currentLevel)}
                            </span>
                        </div>

                        <div
                            class="progress-bar-container"
                            role="progressbar"
                            aria-label="${text(skill)}"
                            aria-valuemin="0"
                            aria-valuemax="${config.xpNeeded}"
                            aria-valuenow="${config.xpTowardsNext}"
                        >
                            <div
                                class="progress-bar"
                                style="width: ${progress.toFixed(2)}%;"
                            ></div>
                        </div>

                        <div class="skill-xp-info">
                            ${formatNumber(config.xpTowardsNext)} /
                            ${formatNumber(config.xpNeeded)} XP
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ------------------------------------------------------------
        // Initialization
        // ------------------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            DateTime = window.luxon?.DateTime;
            tg = window.Telegram?.WebApp;

            initTheme();
            initNavigation();
            initDrawer();
            initJournal();
            initAnalytics();

            document.getElementById('languageSelect')
                .addEventListener('change', event => {
                    applyLanguage(event.target.value);
                });

            if (!DateTime) {
                document.getElementById('homeDashboard').innerHTML = `
                    <div class="status-card" role="alert">
                        ${text('dependencyError')}
                    </div>
                `;
                document.getElementById('homeDashboard')
                    .setAttribute('aria-busy', 'false');

                return;
            }

            applyLanguage(currentLanguage);

            if (tg) {
                tg.ready();
                tg.expand();
            }

            fetchAllLogs();

            // Refresh date-based homepage summaries when returning to the app.
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    updateTodayDate();

                    if (activeView === 'home') {
                        renderHomeDashboard();
                    }
                }
            });
        });
    </script>
