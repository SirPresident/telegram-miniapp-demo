<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Processed Logs & Mood Chart</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js + Luxon + Zoom -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.3/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <!-- noUiSlider -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: rgba(255,255,255,.72);
  --surface-solid: #ffffff;
  --surface-2: rgba(238,241,247,.85);
  --text: #17181c;
  --muted: #727782;
  --soft: #9aa0ad;
  --accent: #6d6cff;
  --accent-2: #9381ff;
  --accent-soft: rgba(109,108,255,.11);
  --line: rgba(20,25,40,.09);
  --shadow: 0 10px 28px rgba(30,35,55,.09);
  --danger: #df6370;
  --success: #2aa673;
  --radius: 18px;
  --radius-lg: 22px;
}

body.dark {
  color-scheme: dark;
  --bg: #0d0f13;
  --surface: rgba(28,30,37,.78);
  --surface-solid: #1b1e25;
  --surface-2: rgba(35,38,47,.9);
  --text: #f4f5f7;
  --muted: #a5a8b2;
  --soft: #777d89;
  --accent: #8d95ff;
  --accent-2: #aa8dff;
  --accent-soft: rgba(141,149,255,.14);
  --line: rgba(255,255,255,.11);
  --shadow: 0 16px 36px rgba(0,0,0,.28);
  --danger: #f07c87;
  --success: #4ac08c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 10% 0%, rgba(124,110,255,.14), transparent 30%),
    radial-gradient(circle at 90% 12%, rgba(77,185,255,.10), transparent 28%),
    var(--bg);
  color: var(--text);
  font: 400 15px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  transition: background-color .2s ease, color .2s ease;
  -webkit-tap-highlight-color: transparent;
}

button, input, select { font: inherit; }
button { color: inherit; }
button, .panel-item, .log-date-header { -webkit-user-select: none; user-select: none; }
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent-soft);
  outline-offset: 2px;
}

.container, .tab-content { width: min(100%, 920px); margin-inline: auto; }
.content { animation: pageIn .22s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

#header {
  margin: 4px 0 16px;
  padding: 0 52px;
  text-align: center;
  position: relative;
}
#header h1, #levelup h2 {
  font-size: clamp(1.3rem, 4vw, 1.6rem);
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: -.025em;
}
#todayDate { margin-top: 4px; color: var(--muted); font-size: .86rem; }

.inner { display: flex; align-items: stretch; gap: 8px; min-width: 0; }
.chart-wrap {
  flex: 1 1 auto;
  min-width: 0;
  height: 350px;
  position: relative;
  overflow: hidden;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.42);
  contain: layout paint;
}
.chart-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 15% 0%, rgba(120,110,255,.10), transparent 42%);
}
.chart-wrap canvas { position: relative; z-index: 1; width: 100% !important; height: 100% !important; }

.segment-label { margin: 12px 0 8px; text-align: center; color: var(--muted); font-size: .82rem; font-weight: 650; }
.nav-buttons { display: flex; gap: 10px; }
.nav-buttons button {
  flex: 1;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  box-shadow: 0 5px 14px var(--shadow-color, rgba(30,35,55,.07));
  font-weight: 650;
  cursor: pointer;
  transition: transform .16s ease, background .16s ease, opacity .16s ease;
}
.nav-buttons button:hover { background: var(--surface-2); transform: translateY(-1px); }
.nav-buttons button:active { transform: scale(.985); }
.nav-buttons button:disabled { opacity: .42; cursor: default; transform: none; }

.range-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin: 14px 0 8px; }
.range-row label { color: var(--muted); font-size: .8rem; font-weight: 650; }
select, .search-input {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 5px 14px rgba(30,35,55,.06);
}
select { padding: 8px 12px; }

/* Lightweight native styling around the existing noUiSlider. Only the track/handles are painted. */
#slider {
  flex: 0 0 9px;
  width: 9px;
  min-width: 9px;
  margin: 8px 10px 8px 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
}
#slider .noUi-connect { background: linear-gradient(to top, var(--danger), var(--success)); border-radius: inherit; }
#slider .noUi-handle {
  width: 18px; height: 18px; right: -5px !important; bottom: -9px;
  border: 2px solid var(--surface-solid); border-radius: 50%;
  background: var(--text); box-shadow: 0 3px 9px rgba(0,0,0,.14); cursor: grab;
}
#slider .noUi-handle:before, #slider .noUi-handle:after { display: none; }

.panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.panel {
  min-width: 0;
  min-height: 150px;
  padding: 15px;
  position: relative;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  contain: layout paint;
}
.panel h3 {
  margin-bottom: 11px;
  color: var(--muted);
  font-size: .73rem;
  font-weight: 750;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.panel h3::before {
  content: "";
  display: inline-block;
  width: 7px; height: 7px; margin: 0 8px 1px 0;
  border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.panel-item {
  display: flex; justify-content: space-between; gap: 8px;
  margin: 2px -4px; padding: 7px 8px;
  border-radius: 9px; cursor: pointer;
  color: var(--text); font-size: .88rem;
  transition: background .14s ease, transform .14s ease;
}
.panel-item span { color: var(--soft) !important; }
.panel-item:hover { background: var(--accent-soft); transform: translateX(2px); }

#logsContainer { margin-top: 18px; }
#loadingMessage { padding: 18px; text-align: center; color: var(--muted); }
.search-container { margin: 4px auto 18px; text-align: center; }
.search-input { width: min(100%, 520px); padding: 11px 14px; }
.search-input::placeholder { color: var(--soft); }
.search-input:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 4px var(--accent-soft); }

.log-group { margin-bottom: 10px; content-visibility: auto; contain-intrinsic-size: 0 120px; }
.log-date-header {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 5px 16px rgba(30,35,55,.06);
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.log-date-header:hover, .log-date-header.expanded { background: var(--accent-soft); border-color: rgba(109,108,255,.22); }
.header-content { display: flex; align-items: center; gap: 10px; font-size: .92rem; font-weight: 650; }
.expand-icon { width: 14px; color: var(--accent); }
.logs-count { margin-left: auto; color: var(--muted); font-size: .76rem; font-weight: 550; }
.log-entries { padding-top: 7px; }
.log-entry {
  margin-top: 7px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 5px 16px rgba(30,35,55,.055);
}
.log-meta { padding-bottom: 6px; margin-bottom: 7px; color: var(--soft); font-size: .76rem; border-bottom: 1px solid var(--line); }
.log-original-note { margin-bottom: 8px; color: var(--muted); line-height: 1.55; font-style: italic; font-size: .9rem; }
.log-section { margin-top: 9px; }
.log-section h3 { margin-bottom: 5px; color: var(--muted); font-size: .7rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.log-section ul { margin: 0 0 4px 18px; padding: 0; }
.log-section li { margin-bottom: 2px; color: var(--muted); font-size: .87rem; }
.tag { display: inline-block; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 700; }

.skills-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.skill-item {
  padding: 15px; position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  transition: transform .18s ease, border-color .18s ease;
}
.skill-item:hover { transform: translateY(-2px); border-color: rgba(109,108,255,.24); }
.skill-header { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.skill-icon { font-size: 1.6rem; line-height: 1; }
.skill-name { flex: 1; font-weight: 700; }
.skill-level { padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .76rem; font-weight: 750; }
.progress-bar-container { height: 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s ease; }
.skill-xp-info { margin-top: 5px; color: var(--soft); text-align: right; font-size: .77rem; }
.skill-focus-section { margin-top: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
.skill-focus-section h3 { margin-bottom: 7px; font-size: .9rem; }
#dailyTaskContainer { margin-top: 12px; padding: 11px; border-radius: 11px; background: var(--surface-2); color: var(--muted); }

.hamburger-menu { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 2001; }
#hamburgerBtn {
  width: 42px; height: 42px; padding: 8px;
  display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); box-shadow: 0 8px 22px rgba(30,35,55,.10);
  cursor: pointer;
}
.hamburger-svg { width: 22px; height: 22px; display: block; filter: invert(0); }
body.dark .hamburger-svg { filter: invert(1); }
.side-menu {
  position: fixed; top: 12px; left: -310px;
  width: min(290px, 82vw); height: calc(100dvh - 24px);
  padding: 66px 18px 22px;
  border: 1px solid var(--line); border-radius: 24px;
  background: var(--surface); box-shadow: 20px 25px 65px rgba(0,0,0,.18);
  transition: left .22s cubic-bezier(.22,1,.36,1);
  overflow: hidden;
}
.side-menu.open { left: 12px; }
.side-menu::before { content: "Settings"; display: block; margin-bottom: 20px; font-size: 1.15rem; font-weight: 750; }
.side-menu-content { display: flex; flex-direction: column; gap: 12px; }
.side-menu-content::before { content: "Appearance"; color: var(--muted); font-size: .69rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.side-menu-content .switch {
  width: 100%; height: 52px; position: relative;
  display: flex; align-items: center; justify-content: flex-end;
  padding: 0 14px; margin: 0 !important;
  border: 1px solid var(--line); border-radius: 15px;
  background: var(--surface-2); box-shadow: 0 6px 16px rgba(30,35,55,.06);
}
.side-menu-content .switch::before { content: "Dark mode"; margin-right: auto; font-size: .88rem; font-weight: 650; }
.switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slider-switch {
  position: absolute; right: 14px; top: 9px; width: 58px; height: 34px;
  border: 1px solid var(--line); border-radius: 999px;
  background: rgba(0,0,0,.10); cursor: pointer;
}
.slider-switch::before {
  content: ""; position: absolute; left: 2px; top: 2px; width: 28px; height: 28px;
  border-radius: 50%; background: #fff; box-shadow: 0 3px 9px rgba(0,0,0,.16);
  transition: transform .24s cubic-bezier(.22,1,.36,1);
}
.slider-switch::after {
  content: ""; position: absolute; left: 9px; top: 9px; width: 15px; height: 15px;
  background: url('assets/icons/Moon.svg') center/contain no-repeat; opacity: .72;
  transition: left .24s cubic-bezier(.22,1,.36,1), opacity .2s;
}
#themeToggle:not(:checked) + .slider-switch::before { transform: translateX(24px); }
#themeToggle:not(:checked) + .slider-switch::after { left: 33px; background-image: url('assets/icons/Sun.svg'); }
#themeToggle:checked + .slider-switch { background: #22252c; }

.capsule-tabs {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1000;
  transform: translateX(-50%);
  display: flex; align-items: center;
  width: min(92%, 430px); padding: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); box-shadow: 0 14px 36px rgba(30,35,55,.13);
}
.capsule-tab-group { display: flex; width: 100%; gap: 4px; }
.capsule-tab-btn {
  flex: 1 1 0; min-width: 0; height: 44px; padding: 0 10px;
  position: relative; display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 999px; background: transparent; cursor: pointer;
}
.capsule-tab-btn:hover { background: var(--surface-2); }
.capsule-icon, .capsule-text { display: flex; align-items: center; justify-content: center; pointer-events: none; }
.capsule-icon { opacity: .7; transition: opacity .16s ease, transform .16s ease; }
.capsule-icon img { width: 20px; height: 20px; }
.capsule-text { color: var(--accent); font-size: .8rem; font-weight: 750; opacity: 0; position: absolute; transform: translateY(4px); transition: opacity .16s ease, transform .16s ease; }
.capsule-tab-btn.active { background: var(--accent-soft); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
.capsule-tab-btn.active .capsule-icon { opacity: 0; transform: translateY(-4px); }
.capsule-tab-btn.active .capsule-text { opacity: 1; transform: none; position: relative; }

@media (max-width: 800px) { .panels { grid-template-columns: 1fr; } .panel { min-height: auto; } }
@media (max-width: 600px) {
  body { padding: 12px 12px calc(88px + env(safe-area-inset-bottom)); }
  #header { padding: 0 42px; }
  .chart-wrap { height: 300px; padding: 12px; border-radius: 19px; }
  .skills-grid { grid-template-columns: 1fr; }
  .capsule-tabs { width: calc(100% - 20px); }
  .capsule-tab-btn { height: 42px; }
  .side-menu { width: min(285px, 84vw); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>






</head>
<body>
    <div class="hamburger-menu">
    <button id="hamburgerBtn" aria-label="Open menu">
        <img src="assets/icons/Menu.svg" alt="Menu" class="hamburger-svg" />
    </button>
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-content">
<label class="switch" aria-label="Toggle dark mode">
                <input type="checkbox" id="themeToggle">
                <span class="slider-switch" aria-hidden="true"></span>
            </label>
            <!-- Add more menu items here if needed -->
        </div>
    </div>
    </div>

    <div class="capsule-tabs">
        <!-- Capsule Tab Navigation -->
        <div class="capsule-tab-group">
        <button class="capsule-tab-btn active" id="tab-home" type="button" role="tab" aria-selected="true" aria-controls="home">
            <span class="capsule-icon">
                <img src="assets/icons/Home.svg" alt="Home icon" class="icon-svg" />
            </span>
            <span class="capsule-text">Home</span>
        </button>
        <button class="capsule-tab-btn" id="tab-logs" type="button" role="tab" aria-selected="false" aria-controls="logs">
            <span class="capsule-icon">
                <img src="assets/icons/Search.svg" alt="Search icon" class="icon-svg" />
            </span>
            <span class="capsule-text">Search</span>
        </button>
        <button class="capsule-tab-btn" id="tab-levelup" type="button" role="tab" aria-selected="false" aria-controls="levelup">
            <span class="capsule-icon">
                <img src="assets/icons/Arrow up.svg" alt="Level up icon" class="icon-svg" />
            </span>
            <span class="capsule-text">Level up</span>
        </button>
        </div>
    </div>

    <main class="tab-content">
        <div id="home" class="content active">
            <div class="container">
                <!-- Remove the "box" class here -->
                <div>
                    <div id="header">
                        <h1>Mood chart</h1>
                        <div id="todayDate"></div>
                    </div>
                    <div class="inner">
                        <!-- Vertical dual-handle slider -->
                        <div id="slider"></div>
                        <!-- Chart -->
                        <div class="chart-wrap">
                            <canvas id="moodScoreChart"></canvas>
                        </div>
                    </div>
                    <!-- Label & nav -->
                    <div class="segment-label" id="segmentLabel"></div>
                    <div class="nav-buttons">

                        <button id="nextWeekBtn" type="button">Next</button>
                    </div>
                    <div class="range-row">
                        <label for="panelRangeSelect" style="margin-right:0.5rem; color:var(--text-color); font-weight:500;">Show data for:</label>
                        <select id="panelRangeSelect" >
                            <option value="week">This week</option>
                            <option value="month">This month</option>

                        </select>

                    <div class="panels">
                        <div class="panel"><h3>Dietary</h3>

                        <div id="loadingMessage">Loading logs...</div>

        <div id="logs" class="content" style="display:none;">
            <div class="container">
                <!-- Remove the "box" class here -->
                <div>
                    <div class="search-container">
                        <input type="text" id="logSearch" placeholder="🔍 Search in logs..." class="search-input">
                    </div>
                    <div id="allLogsContainer"></div>
                </div>
            </div>
        </div>
        <div id="levelup" class="content" style="display:none;">
            <div class="container">
                <!-- Remove the "box" class here -->

                    <h2>Your Skill Progression</h2>
                    <div id="skillsContainer" class="skills-grid">
                        <!-- Skills will be dynamically added here by JavaScript -->
                    </div>
                    <div class="skill-focus-section">
                        <h3>Focus Skill</h3>
                        <select id="skillFocusSelect">
                            <option value="none">None</option>
                            <option value="strength">Strength</option>
                            <option value="endurance">Endurance</option>
                            <option value="intelligence">Intelligence</option>

    <script>
    // Capsule Tab Logic
    document.addEventListener('DOMContentLoaded', () => {
        const tabBtns = [
            { btn: document.getElementById('tab-home'), content: document.getElementById('home') },
            { btn: document.getElementById('tab-logs'), content: document.getElementById('logs') },
            { btn: document.getElementById('tab-levelup'), content: document.getElementById('levelup') }
        ];

        function activateTab(idx) {
            tabBtns.forEach((tab, i) => {
                if (i === idx) {
                    tab.btn.classList.add('active');
                    tab.content.classList.add('active');
                    tab.content.style.display = '';
                } else {
                    tab.btn.classList.remove('active');
                    tab.content.classList.remove('active');
                    tab.content.style.display = 'none';
                }
            });
        }

        tabBtns.forEach((tab, tabIndex) => {
            tab.btn.addEventListener('click', () => {
                activateTab(tabIndex);
                if (tab.content.id === 'logs') {
                    displayAllLogs();
                } else if (tab.content.id === 'levelup') {
                    calculateSkillLevels();
                    displaySkills();
                }
            });
        });

        // Search functionality
        const searchInput = document.getElementById('logSearch');
        let searchTimer = 0;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const searchTerm = e.target.value.trim().toLowerCase();
            searchTimer = setTimeout(() => filterLogs(searchTerm), 110);
        });

        activateTab(0);
    });
    </script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        const initialDark = savedTheme === 'dark';
        document.body.classList.toggle('dark', initialDark);
        themeToggle.checked = initialDark;

        themeToggle.addEventListener('change', (event) => {
            const isDark = event.target.checked;
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            if (moodChartInstance) {
                moodChartInstance.options.scales.x.ticks.color = getComputedStyle(document.body).color;
                moodChartInstance.options.scales.y.ticks.color = getComputedStyle(document.body).color;

    <script>
        const DateTime = luxon.DateTime;
        // Update today's date
        const todayDate = document.getElementById('todayDate');
        todayDate.textContent = DateTime.now().toFormat('LLL dd, yyyy')+ " - Today";

    <script>
        const tg = window.Telegram.WebApp;
        const BACKEND_URL_BASE = 'https://mrfinarfin-bot-subdomain.loca.lt'; // Replace!
        let telegramUser = null;
        let allUserLogs = [];
        let moodChartInstance = null;
        let weekSegments = [];
        let idx = 0;
        let slider = null;

        const SKILLS_CONFIG = {
            strength:     { icon: '💪', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            endurance:    { icon: '🏃', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            intelligence: { icon: '🧠', baseXP: 120, exponent: 1.6, currentXP: 0, currentLevel: 0 },
            charisma:     { icon: '🗣️', baseXP: 100, exponent: 1.5, currentXP: 0, currentLevel: 0 },
            perception:   { icon: '👁️', baseXP: 110, exponent: 1.55, currentXP: 0, currentLevel: 0 },
            wellbeing:    { icon: '🧘', baseXP: 80,  exponent: 1.4, currentXP: 0, currentLevel: 0 }
        };

        function getXPForLevel(level, baseXP, exponent) {
            if (level <= 0) return 0;
            let totalXPNeeded = 0;
            for (let i = 1; i <= level; i++) {
                totalXPNeeded += Math.floor(baseXP * Math.pow(i, exponent - 1));
            }
            return totalXPNeeded;
        }

        function calculateSkillLevels() {
            for (const skillName in SKILLS_CONFIG) {
                const config = SKILLS_CONFIG[skillName];
                config.currentXP = 0;
                config.currentLevel = 0;
            }

            allUserLogs.forEach(log => {
                for (const skillName in SKILLS_CONFIG) {
                    const xpField = `${skillName}_xp_gained`;
                    if (log[xpField] && typeof log[xpField] === 'number') {
                        SKILLS_CONFIG[skillName].currentXP += log[xpField];
                    }
                }
            });

            for (const skillName in SKILLS_CONFIG) {
                const config = SKILLS_CONFIG[skillName];
                let level = 0;
                let xpRemaining = config.currentXP;
                let xpForNextLevel = 0;

                while (true) {
                    xpForNextLevel = getXPForLevel(level + 1, config.baseXP, config.exponent) - 
                                    getXPForLevel(level, config.baseXP, config.exponent);
                    if (xpRemaining >= xpForNextLevel && xpForNextLevel > 0) {
                        xpRemaining -= xpForNextLevel;
                        level++;
                    } else {
                        break;
                    }
                }
                config.currentLevel = level;
                config.xpTowardsNextLevel = xpRemaining;
                config.xpToCompleteCurrentLevel = xpForNextLevel;
            }
        }

        function displaySkills() {
        const skillsContainer = document.getElementById('skillsContainer');
        if (!skillsContainer) return;
        skillsContainer.innerHTML = '';

        let skillsToShowCount = 0;

        for (const skillName in SKILLS_CONFIG) {
            const config = SKILLS_CONFIG[skillName];

            if (config.currentXP > 0) {
                skillsToShowCount++;

                const level = config.currentLevel;
                const xpNeededForThisLevel = getXPForLevel(level + 1, config.baseXP, config.exponent) - 
                                        getXPForLevel(level, config.baseXP, config.exponent);
                const currentXPInThisLevel = config.xpTowardsNextLevel;
                
                let progressPercent = (xpNeededForThisLevel > 0) ? 
                    (currentXPInThisLevel / xpNeededForThisLevel) * 100 : 0;
                progressPercent = Math.min(progressPercent, 100);

                const skillDiv = document.createElement('div');
                skillDiv.className = 'skill-item';
                skillDiv.innerHTML = `
                    <div class="skill-header">
                        <span class="skill-icon">${config.icon}</span>
                        <span class="skill-name">${skillName.charAt(0).toUpperCase() + skillName.slice(1)}</span>
                        <span class="skill-level">Lvl ${level}</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progressPercent}%;"></div>
                    </div>
                    <div class="skill-xp-info">
                        ${currentXPInThisLevel}/${xpNeededForThisLevel} XP
                    </div>
                `;
                skillsContainer.appendChild(skillDiv);
            }
        }

        if (skillsToShowCount === 0) {
            skillsContainer.innerHTML = '<p style="text-align:center; color:var(--text-color);">Start logging activities to see your skills grow here!</p>';
        }
    }

        tg.ready(); tg.expand();

        document.addEventListener('DOMContentLoaded', () => {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                telegramUser = tg.initDataUnsafe.user;
                // document.getElementById('userInfo').innerText = `Logs for: ${telegramUser.first_name || ''} (@${telegramUser.username || 'N/A'})`;
                if (telegramUser.id) {
                    fetchAllLogsAndSetupChart();
                } else {
                    document.getElementById('loadingMessage').innerText = "Cannot load: User ID unavailable.";
                }
            } else {
                document.getElementById('userInfo').innerText = "Could not load Telegram user data.";
                document.getElementById('loadingMessage').innerText = "Cannot load logs: User data unavailable.";
            }

            document.getElementById('prevWeekBtn').addEventListener('click', () => { if(idx>0) idx--; updateView(); });
            document.getElementById('nextWeekBtn').addEventListener('click', () => { if(idx<weekSegments.length-1) idx++; updateView(); });

            // Panel range select event
            const panelRangeSelect = document.getElementById('panelRangeSelect');
            panelRangeSelect.addEventListener('change', (e) => {
                panelRange = e.target.value;
                updatePanels(idx);
            });

            document.querySelector('.panels').addEventListener('click', (e) => {
                const item = e.target.closest('.panel-item');
                if (!item) return;
                const root = e.currentTarget;
                showRelevantLogs(item.dataset.item, item.dataset.type, root._relevantLogs || []);
            });
        });

        function setupChartAndSlider() {
            // Prepare data for the current week
            const ctx = document.getElementById('moodScoreChart').getContext('2d');
            // Plugins
            const thresholdPlugin = {
                id:'thresholdPlugin',
                beforeDraw(c){
                    const {ctx,chartArea:{left,right},scales:{y}} = c;
                    const {min,max} = c.config.options.thresholds;
                    ctx.save(); ctx.setLineDash([6,4]);
                    ctx.strokeStyle='crimson';
                    ctx.beginPath();
                    ctx.moveTo(left,y.getPixelForValue(min));
                    ctx.lineTo(right,y.getPixelForValue(min));
                    ctx.stroke();
                    ctx.strokeStyle='seagreen';
                    ctx.beginPath();
                    ctx.moveTo(left,y.getPixelForValue(max));
                    ctx.lineTo(right,y.getPixelForValue(max));
                    ctx.stroke();
                    ctx.restore();
                }
            };
            const syncHeight = {
                id:'syncHeight',
                afterLayout(c){
                    const slider = document.getElementById('slider');
                    const y = c.scales.y;
                    const top = y.getPixelForValue(c.options.scales.y.max);
                    const bot = y.getPixelForValue(c.options.scales.y.min);
                    const OFF = 0;
                    slider.style.marginTop = (top-OFF+15)+'px';
                    slider.style.height    = (bot-top+OFF*2)+'px';
                }
            };
            // Chart instance
            moodChartInstance = new Chart(ctx, {
                type:'line',
                data:{ datasets:[{ label:'Mood', data:[], fill:true, backgroundColor:makeGradient(ctx), borderColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim(), pointRadius:5, tension:0.3 }]},
                options:{
                    responsive:true,
                    maintainAspectRatio:false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'MMM dd yyyy HH:mm', // More specific tooltip
                                displayFormats: {
                                    day: 'dd'
                                },
                                // timezone: DateTime.local().zoneName // Optional: force local timezone
                            },
                            grid: { display: false },
                            ticks: { 
                                color: document.body.classList.contains('dark') ? '#ffffff' : '#000000'
                            }
                        },
                        y: {
                            min: 1,
                            max: 5,
                            grid: {
                                drawBorder: false,
                                color: getComputedStyle(document.documentElement).getPropertyValue('--shadow-dark').trim()
                            },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim(),
                                stepSize: 1,
                                callback: function(value) {
                                    // Map 1-5 to emojis
                                    const moodEmojis = {
                                        1: "🥵",
                                        2: "🥺",
                                        3: "🙂",
                                        4: "😃",
                                        5: "🤗"
                                    };
                                    return moodEmojis[value] || value;
                                }
                            }
                        }
                    },
                    plugins:{
                        legend:{display:false},
                        zoom:{ pan:{enabled:true,mode:'x'}, zoom:{wheel:{enabled:false},pinch:{enabled:false}} }
                    },
                    thresholds:{ min:2, max:4 }
                },
                plugins:[ syncHeight, thresholdPlugin ]
            });
            // Slider
            slider = document.getElementById('slider');
            if (slider.noUiSlider) slider.noUiSlider.destroy();
            noUiSlider.create(slider,{
                start:[1,5], connect:true,
                orientation:'vertical', direction:'rtl',
                range:{min:1,max:5}, step:0.1,
                tooltips:[false,false], // shows the value of handle
                format:{ to:v=>v.toFixed(1), from:v=>+v }
            });
            let sliderFrame = 0;
            slider.noUiSlider.on('update', ([minRaw, maxRaw]) => {
                const min = +minRaw, max = +maxRaw;
                moodChartInstance.options.thresholds.min = min;
                moodChartInstance.options.thresholds.max = max;
                cancelAnimationFrame(sliderFrame);
                sliderFrame = requestAnimationFrame(() => {
                    const base = getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim();
                    const weekData = getWeekMoodData(idx);
                    moodChartInstance.data.datasets[0].pointBackgroundColor =
                        weekData.map(pt => (pt.y != null && pt.y >= min && pt.y <= max) ? 'seagreen' : base);
                    updatePanels(idx);
                    moodChartInstance.update('none');
                });
            });
        }

        function makeGradient(ctx){
            const h = 300, g = ctx.createLinearGradient(0,0,0,h);
            const root = getComputedStyle(document.documentElement);
            const s = root.getPropertyValue('--chart-grad-start').trim() || 'rgba(54,162,235,0.6)';
            const e = root.getPropertyValue('--chart-grad-end').trim()   || 'rgba(54,162,235,0.1)';
            g.addColorStop(0,s); g.addColorStop(1,e);
            return g;
        }

        async function fetchAllLogsAndSetupChart() {
            const loadingDiv = document.getElementById('loadingMessage');
            loadingDiv.innerText = 'Loading all logs for chart...';
            loadingDiv.style.display = 'block';

            if (!telegramUser || !telegramUser.id) {
                loadingDiv.innerText = 'User ID missing for fetching logs.'; return;
            }
            const fetchUrl = `${BACKEND_URL_BASE}/api/get_user_logs/?telegram_id=${telegramUser.id}`;
            try {
                const response = await fetch(fetchUrl, {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json', 'bypass-tunnel-reminder': 'true'}
                });
                if (response.ok) {
                    const data = await response.json();
                    loadingDiv.style.display = 'none';
                    if (data.logs && data.logs.length > 0) {
                        allUserLogs = data.logs.map(log => ({
                            ...log,
                            // Create a Luxon DateTime object in user's local timezone
                            luxon_logged_at: DateTime.fromISO(log.logged_at.replace(' ', 'T') + 'Z').setZone(DateTime.local().zoneName),
                            strength_xp_gained: log.strength_xp_gained || 0,
                            endurance_xp_gained: log.endurance_xp_gained || 0,
                            intelligence_xp_gained: log.intelligence_xp_gained || 0,
                            charisma_xp_gained: log.charisma_xp_gained || 0,
                            perception_xp_gained: log.perception_xp_gained || 0,
                            wellbeing_xp_gained: log.wellbeing_xp_gained || 0
                        }));
                        allUserLogs.sort((a, b) => a.luxon_logged_at - b.luxon_logged_at);
                        weekSegments = splitLogsToWeeks(allUserLogs);
                        idx = weekSegments.length-1;
                        setupChartAndSlider();
                        updateView();
                        
                        // Calculate and display skills
                        calculateSkillLevels();
                        displaySkills();
                    } else {
                        document.getElementById('logsContainer').innerHTML = '<p style="text-align:center;">No logs found yet.</p>';
                    }
                } else {
                    let errTxt = response.statusText; try {const eD = await response.json(); errTxt = eD.error || errTxt;} catch(e){}
                    loadingDiv.innerText = `Error loading logs: ${response.status} ${errTxt}`;
                }
            } catch (error) {
                loadingDiv.innerText = `Network error loading logs: ${error}`;
                console.error("Fetch logs error:", error);
            }
        }

        function splitLogsToWeeks(logs) {
            if (!logs.length) return [];
            const weeks = [];
            let currentWeekData = [];
            // Use the local start of the week for the first log
            let currentWeekStartLuxon = logs[0].luxon_logged_at.startOf('week');

            logs.forEach(log => {
                if (log.luxon_logged_at >= currentWeekStartLuxon && log.luxon_logged_at < currentWeekStartLuxon.plus({ weeks: 1 })) {
                    currentWeekData.push(log);
                } else {
                    if (currentWeekData.length > 0) {
                        weeks.push(currentWeekData);
                    }
                    currentWeekData = [log];
                    currentWeekStartLuxon = log.luxon_logged_at.startOf('week');
                }
            });
            if (currentWeekData.length > 0) {
                weeks.push(currentWeekData);
            }
            return weeks;
        }

        function getWeekMoodData(weekIdx) {
            if (!weekSegments[weekIdx]) return [];
            const weekLogs = weekSegments[weekIdx];
            if (!weekLogs.length) return [];

            // Determine the actual start of this week segment (Monday in local time)
            const weekActualStartLuxon = weekLogs[0].luxon_logged_at.startOf('week');
            
            const daysData = [];
            for (let i = 0; i < 7; i++) {
                const currentDayLuxon = weekActualStartLuxon.plus({ days: i });
                // Filter logs that fall on this specific local day
                const dayLogs = weekLogs.filter(l =>
                    l.luxon_logged_at.toISODate() === currentDayLuxon.toISODate() &&
                    l.mood_score !== null && l.mood_score !== undefined
                );

                const avg = dayLogs.length
                            ? dayLogs.reduce((s, l) => s + l.mood_score, 0) / dayLogs.length
                            : null;
                daysData.push({
                    x: currentDayLuxon.toISODate(),
                    y: avg
                });
            }
            return daysData;
        }

        function updateView() {
            const weekData = getWeekMoodData(idx);
            moodChartInstance.data.datasets[0].data = weekData;
            moodChartInstance.data.datasets[0].backgroundColor = makeGradient(moodChartInstance.ctx);

            const currentWeekSegment = weekSegments[idx];
            if (currentWeekSegment && currentWeekSegment.length > 0) {
                const weekStartDateLuxon = currentWeekSegment[0].luxon_logged_at.startOf('week');
                const weekEndDateLuxon = weekStartDateLuxon.plus({ days: 6 });

                moodChartInstance.options.scales.x.min = weekStartDateLuxon.toISODate();
                moodChartInstance.options.scales.x.max = weekEndDateLuxon.toISODate();
                
                document.getElementById('segmentLabel').textContent = 
                //     `${weekStartDateLuxon.toFormat('LLL dd')} – ${weekEndDateLuxon.toFormat('LLL dd')}`;
                    `${weekStartDateLuxon.toFormat('LLLL - yyyy')}`;
            } else {
                document.getElementById('segmentLabel').textContent = 'No data for this week';
                moodChartInstance.options.scales.x.min = undefined;
                moodChartInstance.options.scales.x.max = undefined;
            }

            document.getElementById('prevWeekBtn').disabled = (idx === 0);
            document.getElementById('nextWeekBtn').disabled = (idx === weekSegments.length - 1);
            
            updatePanels(idx);
            moodChartInstance.update();
        }

        // Add a global to track the selected range
        let panelRange = 'week';

        // Modify updatePanels to use the selected range
        function updatePanels(weekIdx) {
            // Get current slider values
            const [minMood, maxMood] = slider.noUiSlider.get().map(Number);

            // Determine which logs to use based on panelRange
            let logsToUse = [];
            if (panelRange === 'week') {
                logsToUse = weekSegments[weekIdx] || [];
            } else if (panelRange === 'month') {
                // Get the month and year of the current week
                const weekLogs = weekSegments[weekIdx] || [];
                if (weekLogs.length > 0) {
                    const month = weekLogs[0].luxon_logged_at.month;
                    const year = weekLogs[0].luxon_logged_at.year;
                    logsToUse = allUserLogs.filter(log =>
                        log.luxon_logged_at.month === month && log.luxon_logged_at.year === year
                    );
                }
            } else if (panelRange === 'all') {
                logsToUse = allUserLogs;
            }

            // Group logs by local date using Luxon
            const dailyGroups = new Map();
            logsToUse.forEach(log => {
                const dateKey = log.luxon_logged_at.toISODate();
                if (!dailyGroups.has(dateKey)) {
                    dailyGroups.set(dateKey, {
                        logs: [],
                        totalMoodScore: 0,
                        validMoodCount: 0
                    });
                }
                const group = dailyGroups.get(dateKey);
                group.logs.push(log);
                if (log.mood_score !== null && log.mood_score !== undefined) {
                    group.totalMoodScore += log.mood_score;
                    group.validMoodCount++;
                }
            });

            // Filter days based on average mood score
            const relevantLogs = [];
            dailyGroups.forEach(group => {
                if (group.validMoodCount > 0) {
                    const avgMood = group.totalMoodScore / group.validMoodCount;
                    if (avgMood >= minMood && avgMood <= maxMood) {
                        relevantLogs.push(...group.logs);
                    }
                }
            });

            // Helper function to count and sort items
            function processItems(items) {
                const countMap = new Map();
                items.forEach(item => {
                    countMap.set(item, (countMap.get(item) || 0) + 1);
                });
                return Array.from(countMap.entries())
                    .sort((a, b) => b[1] - a[1])  // Sort by count descending
                    .map(([item, count]) => ({item, count}));
            }

            // Helper function to create panel HTML
            function createPanelHtml(sortedItems, type) {
                return sortedItems.length ? 
                    sortedItems.map(({item, count}) => 
                        `<div class="panel-item" data-item="${escapeHtml(item)}" data-type="${type}">
                            ${escapeHtml(item)} <span style="color:#aaa;">(${count}×)</span>
                        </div>`
                    ).join('') : 
                    '<span style="color:#aaa;">No data in selected mood range</span>';
            }

            // Update panels with filtered data
            // Diet Panel
            const dietPanel = document.getElementById('dietPanel');
            const dietItems = [];
            relevantLogs.forEach(log => {
                if (log.diet) {
                    for (const [cat, arr] of Object.entries(log.diet)) {
                        if (arr && arr.length) {
                            arr.forEach(item => dietItems.push(`${cat}: ${item}`));
                        }
                    }
                }
            });
            const sortedDietItems = processItems(dietItems);
            dietPanel.innerHTML = createPanelHtml(sortedDietItems, 'diet');

            // Health Panel
            const healthPanel = document.getElementById('healthPanel');
            const healthItems = [];
            relevantLogs.forEach(log => {
                if (log.health && log.health.length) {
                    log.health.forEach(item => healthItems.push(item));
                }
            });
            const sortedHealthItems = processItems(healthItems);
            healthPanel.innerHTML = createPanelHtml(sortedHealthItems, 'health');

            // Activity Panel
            const activityPanel = document.getElementById('activityPanel');
            const activityItems = [];
            relevantLogs.forEach(log => {
                if (log.activity && log.activity.length) {
                    log.activity.forEach(item => activityItems.push(item));
                }
            });
            const sortedActivityItems = processItems(activityItems);
            activityPanel.innerHTML = createPanelHtml(sortedActivityItems, 'activity');

            // Click handling is delegated once from the panels container.
            const panelsRoot = document.querySelector('.panels');
            panelsRoot.dataset.relevantLogs = '';
            panelsRoot._relevantLogs = relevantLogs;
        }

function showRelevantLogs(itemText, itemType, logs) {
    const relevantLogs = logs.filter(log => {
        if (itemType === 'diet') {
            return log.diet && Object.entries(log.diet).some(([cat, arr]) => 
                arr && arr.length && arr.some(item => `${cat}: ${item}` === itemText)
            );
        } else {
            return log[itemType] && log[itemType].includes(itemText);
        }
    });
    
    // Display the filtered logs
    const container = document.getElementById('logsContainer');
    container.classList.add('active');
    // Add the clicked entry as a title above the logs
    container.innerHTML = `<h2 style="margin-bottom:1rem; color:var(--text-color); font-size:1.2rem;">${escapeHtml(itemText)}</h2>`;
    displayLogEntries(relevantLogs, container);
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Update displayLogEntries to accept the container as an argument
function displayLogEntries(logsToDisplay, container = document.getElementById('logsContainer')) {
    // If container already has a title, don't overwrite it
    if (!container.querySelector('h2')) container.innerHTML = '';
    if (logsToDisplay && logsToDisplay.length > 0) {
        logsToDisplay.slice().reverse().forEach(log => {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'log-entry';
            let htmlContent = `<div class="log-meta">Logged: ${escapeHtml(log.logged_at || "")}</div>`;
            if(log.original_note) {
                htmlContent += `<div class="log-original-note"><strong>Original:</strong> ${escapeHtml(log.original_note)}</div>`;
            }
            if (log.mood_label) {
                htmlContent += `<div class="log-section"><h3>Mood</h3><span class="tag">${escapeHtml(log.mood_label)} (${log.mood_score || 'N/A'})</span></div>`;
            }
            if (log.health && log.health.length > 0) {
                htmlContent += `<div class="log-section"><h3>Health</h3><ul>`;
                log.health.forEach(h => { htmlContent += `<li>${escapeHtml(h)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.activity && log.activity.length > 0) {
                htmlContent += `<div class="log-section"><h3>Activity</h3><ul>`;
                log.activity.forEach(a => { htmlContent += `<li>${escapeHtml(a)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.diet && log.diet.length > 0) {
                htmlContent += `<div class="log-section"><h3>Diet</h3><ul>`;
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.length) {
                        items.forEach(item => {
                            htmlContent += `<li>${escapeHtml(category)}: ${escapeHtml(item)}</li>`;
                        });
                    }
                }
                htmlContent += `</ul></div>`;
            }
            entryDiv.innerHTML = htmlContent;
            container.appendChild(entryDiv);
        });
    } else {
        container.innerHTML += '<p style="text-align:center;">No logs found for this period or user.</p>';
    }
}

        let logsRendered = false;
        function displayAllLogs(force = false) {
    const container = document.getElementById('allLogsContainer');
    if (logsRendered && !force) return;
    if (!allUserLogs || !allUserLogs.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:18px;">No logs found yet.</p>';
        logsRendered = true;
        return;
    }

    // Group logs by local date using Luxon
    const groupedLogs = new Map();
    allUserLogs.forEach(log => {
        const dateKey = log.luxon_logged_at.toISODate();
        if (!groupedLogs.has(dateKey)) {
            groupedLogs.set(dateKey, []);
        }
        groupedLogs.get(dateKey).push(log);
    });

    // Sort dates in descending order
    const sortedDates = Array.from(groupedLogs.keys()).sort().reverse();
    
    // Generate HTML with collapsible sections
    container.innerHTML = sortedDates.map(date => {
        const logs = groupedLogs.get(date);
        const logsCount = logs.length;
        return `
            <div class="log-group" data-date="${date}">
                <div class="log-date-header collapsible">
                    <div class="header-content">
                        <span class="expand-icon">▶</span>
                        ${DateTime.fromISO(date).toFormat('LLLL d, yyyy')}
                        <span class="logs-count">(${logsCount} log${logsCount !== 1 ? 's' : ''})</span>
                    </div>
                </div>
                <div class="log-entries" hidden>
                    ${logs.map(log => createLogEntryHtml(log)).join('')}
                </div>
            </div>
        `;
    }).join('');

    logsRendered = true;
}

        function createLogEntryHtml(log) {
            const searchable = buildSearchText(log);
            let htmlContent = `<div class="log-entry" data-search="${escapeHtml(searchable)}">
                <div class="log-meta">Logged: ${escapeHtml(log.logged_at || '')}</div>`;
            
            if(log.original_note) {
                htmlContent += `<div class="log-original-note"><strong>Original:</strong> ${escapeHtml(log.original_note)}</div>`;
            }
            if (log.mood_label) {
                htmlContent += `<div class="log-section"><h3>Mood</h3><span class="tag">${escapeHtml(log.mood_label)} (${log.mood_score || 'N/A'})</span></div>`;
            }
            if (log.health && log.health.length > 0) {
                htmlContent += `<div class="log-section"><h3>Health</h3><ul>`;
                log.health.forEach(h => { htmlContent += `<li>${escapeHtml(h)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.activity && log.activity.length > 0) {
                htmlContent += `<div class="log-section"><h3>Activity</h3><ul>`;
                log.activity.forEach(a => { htmlContent += `<li>${escapeHtml(a)}</li>`; });
                htmlContent += `</ul></div>`;
            }
            if (log.diet && log.diet.length > 0) {
                htmlContent += `<div class="log-section"><h3>Diet</h3><ul>`;
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.length) {
                        items.forEach(item => {
                            htmlContent += `<li>${escapeHtml(category)}: ${escapeHtml(item)}</li>`;
                        });
                    }
                }
                htmlContent += `</ul></div>`;
            }
            htmlContent += `</div>`;
            return htmlContent;
        }

function filterLogs(searchTerm) {
    const groups = document.querySelectorAll('.log-group');
    
    groups.forEach(group => {
        const entries = group.querySelectorAll('.log-entry');
        let hasVisibleLogs = false;
        
        entries.forEach(entry => {
            const shouldShow = !searchTerm || entry.dataset.search.includes(searchTerm);
            entry.style.display = shouldShow ? '' : 'none';
            if (shouldShow) hasVisibleLogs = true;
        });
        
        group.style.display = hasVisibleLogs ? '' : 'none';
        
        // If searching, automatically expand groups with matches
        const entriesContainer = group.querySelector('.log-entries');
        const header = group.querySelector('.log-date-header');
        const icon = header.querySelector('.expand-icon');
        
        if (searchTerm && hasVisibleLogs) {
            entriesContainer.hidden = false;
            icon.textContent = '▼';
            header.classList.add('expanded');
        } else if (!searchTerm) {
            entriesContainer.hidden = true;
            icon.textContent = '▶';
            header.classList.remove('expanded');
        }
    });
}

        function searchInLog(log, term) {
            if (!term) return true;
            
            // Search in original note
            if (log.original_note && log.original_note.toLowerCase().includes(term)) return true;
            
            // Search in mood label
            if (log.mood_label && log.mood_label.toLowerCase().includes(term)) return true;
            
            // Search in health items
            if (log.health && log.health.some(h => h.toLowerCase().includes(term))) return true;
            
            // Search in activities
            if (log.activity && log.activity.some(a => a.toLowerCase().includes(term))) return true;
            
            // Search in diet items
            if (log.diet) {
                for (const [category, items] of Object.entries(log.diet)) {
                    if (items && items.some(item => 
                        item.toLowerCase().includes(term) || 
                        category.toLowerCase().includes(term)
                    )) return true;
                }
            }
            
            return false;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sideMenu = document.getElementById('sideMenu');

    hamburgerBtn.addEventListener('click', () => {
        sideMenu.classList.toggle('open');
    });

    // Optional: close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!sideMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
            sideMenu.classList.remove('open');
        }
    });

    document.getElementById('allLogsContainer').addEventListener('click', (e) => {
        const header = e.target.closest('.log-date-header');
        if (!header) return;
        const entries = header.nextElementSibling;
        const icon = header.querySelector('.expand-icon');
        const isExpanded = entries.hidden;
        entries.hidden = !isExpanded;
        icon.textContent = isExpanded ? '▼' : '▶';
        header.classList.toggle('expanded', isExpanded);
    });
});
    </script>
